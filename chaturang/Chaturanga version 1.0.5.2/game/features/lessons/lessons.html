<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Chaturanga Lessons — v2.0.0</title>
<meta name="description" content="Learn Chaturanga through 18 interactive lessons rooted in Indian philosophy — Mahabharata, Bhagavad Gita, Panchatantra, Ramayana and Chanakya Niti."/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link rel="stylesheet" href="../../css/styles.css"/>
<link rel="stylesheet" href="../../css/animations.css"/>
<link rel="stylesheet" href="../../css/themes.css"/>
<script>(function(){var t=localStorage.getItem('chaturanga_theme');if(t&&t!=='classic')document.documentElement.className='theme-'+t;})();</script>
<style>
:root{
  --sq:56px;
  --gold:#c9a84c; --gold2:#f0cc7a;
  --dark:#0f0c06; --dark2:#17130a; --dark3:#1f1a0f;
  --border:rgba(201,168,76,.18); --border2:rgba(201,168,76,.3);
  --text:#e3dcc9; --muted:#948c78; --muted2:#6d6656;
  --green:#5c7a52; --green2:#7c9473;
  --purple:#5a4f7c; --purple2:#7a6ba0;
  --crimson:#9c4a3f; --crimson2:#c06a52;
  --blue:#3f6b8a; --blue2:#5a8fae;
  --maroon:#7a3b3b; --maroon2:#a35555;
  --ok:#4ade80; --bad:#f87171;
}
*{box-sizing:border-box}
body{background:var(--dark);font-family:'Outfit',sans-serif;color:var(--text)}

/* ============ TOP NAV ============ */
.top-nav{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--dark2)}
.nav-logo{text-decoration:none;display:flex;align-items:center;gap:10px}
.nav-logo i{color:var(--gold);font-size:1.1rem}
.nav-logo span{font-family:'Cinzel',serif;color:var(--gold);font-size:1.05rem;letter-spacing:.02em}
.nav-version{font-size:.62rem;color:var(--muted2);margin-left:6px;vertical-align:middle}
.nav-icon-btn{width:36px;height:36px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);border:1px solid var(--border);transition:all .15s}
.nav-icon-btn:hover{color:var(--gold);border-color:var(--border2);background:rgba(201,168,76,.06)}

/* ============ SHELL ============ */
.ls-shell{max-width:1180px;margin:0 auto;padding:28px 20px 90px}
.crumb{display:flex;align-items:center;gap:10px;margin-bottom:22px;font-family:'Cinzel',serif}
.crumb a, .crumb span.current{text-decoration:none;color:var(--muted);font-size:.85rem;display:flex;align-items:center;gap:8px}
.crumb a:hover{color:var(--gold)}
.crumb .sep{color:var(--muted2);font-size:.75rem}
.crumb span.current{color:var(--gold)}
.crumb i.crumb-icon{font-size:.95rem}

/* ============ HERO / SEARCH (topics view) ============ */
.ls-hero{text-align:center;margin-bottom:30px}
.ls-hero h1{font-family:'Cinzel',serif;font-size:1.9rem;color:var(--gold);margin:0 0 6px}
.ls-hero p{color:var(--muted);font-size:.9rem;font-style:italic;margin:0 0 22px}
.ls-search{max-width:520px;margin:0 auto;position:relative}
.ls-search input{width:100%;padding:12px 16px 12px 42px;border-radius:10px;border:1px solid var(--border);background:var(--dark2);color:var(--text);font-family:'Outfit',sans-serif;font-size:.88rem;outline:none;transition:border-color .15s}
.ls-search input:focus{border-color:var(--border2)}
.ls-search i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted2)}

/* overall progress strip */
.ls-progress-strip{display:flex;align-items:center;gap:16px;max-width:600px;margin:22px auto 0;background:rgba(201,168,76,.05);border:1px solid var(--border);border-radius:10px;padding:12px 18px}
.ls-progress-strip .bar{flex:1;height:8px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden}
.ls-progress-strip .bar-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:6px;transition:width .3s}
.ls-progress-strip .pct{font-size:.78rem;color:var(--gold);font-weight:600;white-space:nowrap}

/* ============ TOPIC CARD GRID ============ */
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;margin-top:28px}
.topic-card{display:flex;gap:0;background:var(--dark2);border:1px solid var(--border);border-radius:14px;overflow:hidden;text-decoration:none;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}
.topic-card:hover{transform:translateY(-3px);border-color:var(--border2);box-shadow:0 10px 26px rgba(0,0,0,.35)}
.topic-thumb{width:150px;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.topic-thumb i.big{font-size:2.3rem;color:rgba(255,255,255,.92);filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.topic-thumb::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.14),transparent 60%)}
.topic-thumb .ring{position:absolute;width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.12)}
.topic-body{flex:1;padding:16px 18px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.topic-title{font-family:'Cinzel',serif;font-size:1.05rem;color:var(--text);margin:0 0 5px;display:flex;align-items:center;gap:8px}
.topic-desc{font-size:.78rem;color:var(--muted);line-height:1.5;margin:0 0 10px}
.topic-meta{display:flex;gap:10px;align-items:center;font-size:.68rem}
.topic-meta .m-count{color:var(--gold);font-weight:600}
.topic-meta .m-diff{color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--border);padding:2px 8px;border-radius:8px}
.topic-progress-ring{margin-left:auto;width:34px;height:34px;flex-shrink:0}
.topic-progress-ring svg{transform:rotate(-90deg)}
.topic-progress-ring text{font-size:9px;fill:var(--gold);font-family:'Outfit',sans-serif}

/* ============ TOPIC DETAIL: LESSON LIST ============ */
.topic-header{display:flex;align-items:center;gap:16px;margin-bottom:26px}
.topic-header .icon-badge{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.topic-header .icon-badge i{font-size:1.5rem;color:#fff}
.topic-header h1{font-family:'Cinzel',serif;font-size:1.5rem;color:var(--gold);margin:0 0 4px}
.topic-header p{font-size:.82rem;color:var(--muted);margin:0}

.lesson-list{display:flex;flex-direction:column;gap:12px}
.lesson-row{display:flex;align-items:center;gap:16px;background:var(--dark2);border:1px solid var(--border);border-radius:12px;padding:14px 18px;cursor:pointer;text-decoration:none;transition:border-color .15s,background .15s}
.lesson-row:hover{border-color:var(--border2);background:var(--dark3)}
.lesson-row .lr-icon{width:46px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.lesson-row .lr-icon i{color:#fff;font-size:1.1rem}
.lesson-row .lr-icon .done-check{position:absolute;bottom:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:var(--ok);color:#0a0a0a;display:flex;align-items:center;justify-content:center;font-size:.6rem;border:2px solid var(--dark2)}
.lr-body{flex:1;min-width:0}
.lr-title{font-weight:600;color:var(--text);font-size:.95rem;margin-bottom:2px}
.lr-sub{font-size:.74rem;color:var(--muted);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.lr-meta .steps{font-size:.7rem;color:var(--gold);font-weight:600}
.lr-meta .diff{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--border);padding:2px 8px;border-radius:8px}
.lr-arrow{color:var(--muted2);font-size:.85rem;flex-shrink:0}

/* ============ LESSON PLAYER ============ */
.player-layout{display:grid;grid-template-columns:auto 340px;gap:36px;align-items:start;justify-content:center}
.player-board-wrap{display:flex;flex-direction:column;align-items:center}
.board-frame{border:2px solid var(--gold);border-radius:6px;padding:6px;background:var(--dark2);position:relative}
.ls-board{display:grid;grid-template-columns:repeat(8,var(--sq));position:relative}
.ls-sq{width:var(--sq);height:var(--sq);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:background .15s}
.ls-sq.light{background:#f0d9b5}.ls-sq.dark{background:#b58863}
.ls-sq.highlight{outline:3px solid var(--gold);outline-offset:-3px;box-shadow:inset 0 0 12px rgba(201,168,76,.35)}
.ls-sq.hinting{animation:ls-pulse 1s ease-in-out infinite}
@keyframes ls-pulse{0%,100%{box-shadow:inset 0 0 6px rgba(201,168,76,.2)}50%{box-shadow:inset 0 0 22px rgba(201,168,76,.7)}}
.ls-sq.selected{background:rgba(201,168,76,.55) !important}
.ls-sq.legal-move::after{content:'';width:28%;height:28%;background:rgba(0,0,0,.3);border-radius:50%;display:block}
.ls-piece{width:82%;height:82%;object-fit:cover;clip-path:circle(44% at center);position:absolute;top:9%;left:9%;z-index:2;pointer-events:none;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,0.7));transition:transform .12s ease}
.board-arrows{position:absolute;inset:6px;pointer-events:none;z-index:5}
.file-labels,.rank-labels{display:flex;font-size:.62rem;color:var(--muted2);font-family:'Outfit',sans-serif}
.file-labels{justify-content:space-around;width:calc(var(--sq)*8);margin-top:4px}
.turn-pill{margin-top:14px;font-size:.78rem;color:var(--gold);background:rgba(201,168,76,.08);border:1px solid var(--border);padding:5px 16px;border-radius:14px;font-weight:600;letter-spacing:.02em}

/* right panel */
.player-panel{position:sticky;top:16px}
.panel-back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);text-decoration:none;font-size:.8rem;margin-bottom:14px}
.panel-back:hover{color:var(--gold)}
.panel-title{font-family:'Cinzel',serif;font-size:1.25rem;color:var(--gold);margin:0 0 4px}
.panel-sub{font-size:.78rem;color:var(--muted);font-style:italic;margin-bottom:16px}

.narration-card{background:rgba(201,168,76,.08);border:1px solid var(--gold);border-radius:10px;padding:14px 16px;font-size:.85rem;line-height:1.65;color:var(--text);margin-bottom:12px}
.instruction-card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:.8rem;color:var(--gold);margin-bottom:10px;display:flex;gap:8px;align-items:flex-start}
.ls-status{font-size:.85rem;min-height:22px;font-weight:600;margin-bottom:12px}
.ls-status.correct{color:var(--ok)}.ls-status.wrong{color:var(--bad)}

.chapter-box{background:var(--dark2);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-top:6px}
.chapter-box .cb-head{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--muted);margin-bottom:8px;font-weight:600}
.cb-bar{height:6px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden;margin-bottom:14px}
.cb-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:6px;transition:width .3s}
.hint-btn{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border2);background:transparent;color:var(--gold);font-family:'Outfit',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
.hint-btn:hover{background:rgba(201,168,76,.08)}
.panel-actions{display:flex;gap:10px;margin-top:10px}
.icon-link-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;background:transparent}
.icon-link-btn:hover{color:var(--gold);border-color:var(--border2)}

.badge-panel{display:none;text-align:center;margin-top:16px;background:rgba(201,168,76,.06);border:1px solid var(--gold);border-radius:10px;padding:18px}
.badge-pill{display:inline-block;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1306;border-radius:12px;padding:4px 14px;font-size:.75rem;font-weight:700;margin-top:8px}
.moral-text{margin-top:10px;font-size:.8rem;color:#ccc;font-style:italic;line-height:1.6}
.next-lesson-btn{margin-top:16px;width:100%;padding:11px;border-radius:8px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1306;text-decoration:none;font-weight:700;font-size:.85rem;display:flex;align-items:center;justify-content:center;gap:8px}

@media(max-width:860px){
  :root{--sq:40px}
  .player-layout{grid-template-columns:1fr;justify-items:center}
  .player-panel{position:static;width:100%;max-width:420px}
  .topic-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<nav class="top-nav">
  <a href="../../" class="nav-logo">
    <i class="fa-solid fa-graduation-cap"></i>
    <span>Chaturanga Lessons</span>
    <span class="nav-version">v2.0.0</span>
  </a>
  <div style="display:flex;gap:10px">
    <a href="../../lessons/vyuha-formations.html" class="nav-icon-btn" title="Vyuha Formations"><i class="fa-brands fa-pagelines"></i></a>
    <a id="acharyaLink" href="../../lessons/acharya.html" class="nav-icon-btn" title="Ask Acharya"><i class="fa-solid fa-chalkboard-user"></i></a>
    <a href="puzzles.html" class="nav-icon-btn" title="Puzzles"><i class="fa-solid fa-puzzle-piece"></i></a>
    <a href="../../" class="nav-icon-btn" title="Tournament"><i class="fa-solid fa-trophy"></i></a>
    <a href="../../" class="nav-icon-btn" title="Game"><i class="fa-solid fa-chess-board"></i></a>
  </div>
</nav>

<div class="ls-shell" id="app"></div>

<script src="../../lessons/lesson-data.js"></script>
<script src="../../lessons/lesson-engine.js"></script>
<script>
const PIECE_SYMBOLS={pawn:'♟',horse:'♞',elephant:'♝',rook:'♜',king:'♚'};
const PLAYER_COLORS=['red','blue','green','yellow'];
const PIECE_NAMES={pawn:'Nara',horse:'Ashwa',elephant:'Danti',rook:'Ratha',king:'Raja'};

const TOPIC_META={
  basics:   {label:'Basics',   icon:'fa-chess-pawn',            color:'var(--green)',  color2:'var(--green2)',  desc:'Learn how each piece moves and captures on the Ashtāpada.'},
  opening:  {label:'Opening',  icon:'fa-arrow-up-right-dots',    color:'var(--purple)', color2:'var(--purple2)', desc:'Develop your army with purpose in the opening.'},
  tactics:  {label:'Tactics',  icon:'fa-crosshairs',             color:'var(--crimson)',color2:'var(--crimson2)',desc:'Spot pins, forks and leaps to seize the advantage.'},
  endgame:  {label:'Endgame',  icon:'fa-flag-checkered',         color:'var(--maroon)', color2:'var(--maroon2)', desc:'Convert your advantage with precise king and Ratha technique.'},
  alliance: {label:'Alliance', icon:'fa-handshake',              color:'var(--blue)',   color2:'var(--blue2)',   desc:'Four-player Chaturanga — coordinate with your ally.'},
  advanced: {label:'Advanced', icon:'fa-brain',                  color:'var(--gold)',   color2:'var(--gold2)',   desc:'Sacrifice, zugzwang and multi-piece combinations.'}
};
const DIFF_ORDER=['newbie','beginner','intermediate','advanced'];

const app=document.getElementById('app');
let boardMap=null, selectedSq=null, activeLesson=null, hinting=false;

/* ---------- routing ---------- */
function route(){
  const hash=location.hash.replace(/^#\/?/,'');
  const parts=hash.split('/').filter(Boolean);
  hinting=false;
  if(parts[0]==='topic' && parts[1]) renderTopic(parts[1]);
  else if(parts[0]==='lesson' && parts[1]) renderLessonPlayer(parts[1]);
  else renderTopics();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* ---------- data helpers ---------- */
function lessons(){ return globalThis.ChaturangaLessonData||[]; }
function categories(){ return [...new Set(lessons().map(l=>l.category))]; }
function lessonsIn(cat){ return lessons().filter(l=>l.category===cat); }
function isDone(id){ return globalThis.ChaturangaLessonEngine.isCompleted(id); }
function overallProgress(){
  const all=lessons(); const done=all.filter(l=>isDone(l.id)).length;
  return {done,total:all.length,pct:all.length?Math.round(done/all.length*100):0};
}
function topDiff(cat){
  const diffs=lessonsIn(cat).map(l=>(l.difficulty||'newbie').toLowerCase());
  diffs.sort((a,b)=>DIFF_ORDER.indexOf(a)-DIFF_ORDER.indexOf(b));
  return diffs[0]||'newbie';
}

/* ============================================================
   VIEW 1: TOPIC GRID (home)
   ============================================================ */
function renderTopics(){
  const prog=overallProgress();
  let html=`
    <div class="ls-hero">
      <h1>Chaturanga Lessons</h1>
      <p>Eighteen lessons in the ancient game, rooted in Indian philosophy and history</p>
      <div class="ls-search"><i class="fa-solid fa-magnifying-glass"></i><input id="topicSearch" placeholder="Search topics or lessons..."/></div>
      <div class="ls-progress-strip">
        <span style="font-size:.78rem;color:var(--muted)">Overall progress</span>
        <div class="bar"><div class="bar-fill" style="width:${prog.pct}%"></div></div>
        <span class="pct">${prog.done}/${prog.total} · ${prog.pct}%</span>
      </div>
    </div>
    <div class="topic-grid" id="topicGrid"></div>`;
  app.innerHTML=html;
  buildTopicGrid(categories());
  document.getElementById('topicSearch').addEventListener('input',e=>{
    const q=e.target.value.trim().toLowerCase();
    if(!q){ buildTopicGrid(categories()); return; }
    const matchedCats=categories().filter(cat=>{
      if((TOPIC_META[cat]?.label||cat).toLowerCase().includes(q)) return true;
      return lessonsIn(cat).some(l=>l.title.toLowerCase().includes(q)||(l.culturalSource||'').toLowerCase().includes(q));
    });
    buildTopicGrid(matchedCats);
  });
}

function buildTopicGrid(cats){
  const grid=document.getElementById('topicGrid');
  if(!cats.length){ grid.innerHTML='<p style="color:var(--muted);grid-column:1/-1;text-align:center;padding:30px">No topics match your search.</p>'; return; }
  grid.innerHTML=cats.map(cat=>{
    const meta=TOPIC_META[cat]||{label:cat,icon:'fa-book',color:'var(--gold)',color2:'var(--gold2)',desc:''};
    const catLessons=lessonsIn(cat);
    const done=catLessons.filter(l=>isDone(l.id)).length;
    const total=catLessons.length;
    const pct=total?Math.round(done/total*100):0;
    const r=15, c=2*Math.PI*r;
    return `<a class="topic-card" href="#/topic/${cat}">
      <div class="topic-thumb" style="background:linear-gradient(135deg,${meta.color},${meta.color2})">
        <span class="ring"></span><i class="fa-solid ${meta.icon} big"></i>
      </div>
      <div class="topic-body">
        <h3 class="topic-title">${meta.label}</h3>
        <p class="topic-desc">${meta.desc}</p>
        <div class="topic-meta">
          <span class="m-count">${total} Lesson${total!==1?'s':''}</span>
          <span class="m-diff">${topDiff(cat)}</span>
          <span class="topic-progress-ring">
            <svg width="34" height="34" viewBox="0 0 34 34">
              <circle cx="17" cy="17" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="3"/>
              <circle cx="17" cy="17" r="${r}" fill="none" stroke="var(--gold)" stroke-width="3"
                stroke-dasharray="${c}" stroke-dashoffset="${c-(pct/100)*c}" stroke-linecap="round"/>
              <text x="17" y="20" text-anchor="middle">${pct}%</text>
            </svg>
          </span>
        </div>
      </div>
    </a>`;
  }).join('');
}

/* ============================================================
   VIEW 2: TOPIC DETAIL — LESSON LIST
   ============================================================ */
function renderTopic(cat){
  const meta=TOPIC_META[cat]||{label:cat,icon:'fa-book',color:'var(--gold)',color2:'var(--gold2)',desc:''};
  const catLessons=lessonsIn(cat);
  app.innerHTML=`
    <div class="crumb">
      <a href="#/"><i class="fa-solid fa-graduation-cap crumb-icon"></i> Lessons</a>
      <span class="sep">/</span>
      <span class="current">${meta.label}</span>
    </div>
    <div class="topic-header">
      <div class="icon-badge" style="background:linear-gradient(135deg,${meta.color},${meta.color2})"><i class="fa-solid ${meta.icon}"></i></div>
      <div>
        <h1>${meta.label}</h1>
        <p>${meta.desc}</p>
      </div>
    </div>
    <div class="lesson-list" id="lessonList"></div>`;
  const list=document.getElementById('lessonList');
  list.innerHTML=catLessons.map((l,i)=>{
    const done=isDone(l.id);
    const stepCount=(l.steps||[]).length;
    return `<a class="lesson-row" href="#/lesson/${l.id}">
      <div class="lr-icon" style="background:linear-gradient(135deg,${meta.color},${meta.color2})">
        <i class="fa-solid ${meta.icon}"></i>
        ${done?'<span class="done-check"><i class="fa-solid fa-check"></i></span>':''}
      </div>
      <div class="lr-body">
        <div class="lr-title">${i+1}. ${l.title}</div>
        <div class="lr-sub">${l.culturalSource||''}</div>
      </div>
      <div class="lr-meta">
        <span class="steps">${stepCount} Chapter${stepCount!==1?'s':''}</span>
        <span class="diff">${l.difficulty||''}</span>
      </div>
      <i class="fa-solid fa-chevron-right lr-arrow"></i>
    </a>`;
  }).join('');
}

/* ============================================================
   VIEW 3: LESSON PLAYER
   ============================================================ */
function defaultBoard(){
  return {'a1':{owner:0,type:'rook'},'e1':{owner:0,type:'king'},'h8':{owner:1,type:'king'},'h7':{owner:1,type:'rook'}};
}
function freshBoardMap(l){
  const boardDef=l.boardState||defaultBoard();
  const map=new Map();
  Object.entries(boardDef).forEach(([sq,v])=>{
    map.set(sq, typeof v==='string' ? (([o,t])=>({owner:parseInt(o),type:t}))(v.split(':')) : v);
  });
  return map;
}

function renderLessonPlayer(id){
  const l=lessons().find(x=>x.id===id);
  if(!l){ location.hash='#/'; return; }
  const meta=TOPIC_META[l.category]||{label:l.category,icon:'fa-book',color:'var(--gold)',color2:'var(--gold2)'};

  activeLesson=l;
  globalThis.ChaturangaLessonEngine.startLesson(l);
  boardMap=freshBoardMap(l);
  selectedSq=null;

  app.innerHTML=`
    <div class="crumb">
      <a href="#/"><i class="fa-solid fa-graduation-cap crumb-icon"></i> Lessons</a>
      <span class="sep">/</span>
      <a href="#/topic/${l.category}">${meta.label}</a>
      <span class="sep">/</span>
      <span class="current">${l.title}</span>
    </div>
    <div class="player-layout">
      <div class="player-board-wrap">
        <div class="file-labels" id="fileLabelsTop">${'abcdefgh'.split('').map(f=>`<span>${f}</span>`).join('')}</div>
        <div class="board-frame">
          <div class="ls-board" id="lsBoard"></div>
          <svg class="board-arrows" id="boardArrows" width="${8*56}" height="${8*56}"></svg>
        </div>
        <div class="turn-pill" id="turnPill">Red to move</div>
      </div>
      <div class="player-panel">
        <a class="panel-back" href="#/topic/${l.category}"><i class="fa-solid fa-arrow-left"></i> ${meta.label}</a>
        <h2 class="panel-title">${l.title}</h2>
        <p class="panel-sub">${l.culturalSource||''}</p>

        <div class="narration-card" id="narrCard"></div>
        <div class="instruction-card" id="instCard"><i class="fa-solid fa-arrow-right" style="color:var(--gold);margin-top:2px"></i><span id="instText"></span></div>
        <div class="ls-status" id="statusEl"></div>

        <div class="chapter-box">
          <div class="cb-head"><span id="chapLabel">Chapter 1/${l.steps.length}</span></div>
          <div class="cb-bar"><div class="cb-bar-fill" id="chapBar" style="width:${100/l.steps.length}%"></div></div>
          <button class="hint-btn" id="hintBtn"><i class="fa-solid fa-lightbulb"></i> Hint</button>
          <div class="panel-actions">
            <button class="icon-link-btn" title="Share" id="shareBtn"><i class="fa-solid fa-share-nodes"></i></button>
            <button class="icon-link-btn" title="Restart lesson" id="restartBtn"><i class="fa-solid fa-rotate-left"></i></button>
          </div>
        </div>

        <div class="badge-panel" id="badgePanel"></div>
      </div>
    </div>`;

  document.getElementById('hintBtn').onclick=()=>{ hinting=!hinting; renderBoard(); };
  document.getElementById('restartBtn').onclick=()=>renderLessonPlayer(id);
  document.getElementById('shareBtn').onclick=()=>{
    navigator.clipboard && navigator.clipboard.writeText(location.href);
    const b=document.getElementById('shareBtn'); const old=b.innerHTML;
    b.innerHTML='<i class="fa-solid fa-check"></i>'; setTimeout(()=>b.innerHTML=old,1200);
  };

  showStep(globalThis.ChaturangaLessonEngine.getCurrentStepData());
  renderBoard();
}

function showStep(step){
  if(!step) return;
  document.getElementById('narrCard').textContent=step.narration||'';
  document.getElementById('instText').textContent=step.instruction||'';
  document.getElementById('statusEl').textContent='';
  document.getElementById('statusEl').className='ls-status';
  const l=activeLesson;
  const cur=globalThis.ChaturangaLessonEngine.currentStep;
  document.getElementById('chapLabel').textContent=`Chapter ${cur+1}/${l.steps.length}`;
  document.getElementById('chapBar').style.width=((cur+1)/l.steps.length*100)+'%';
}

function renderBoard(){
  const l=activeLesson;
  const step=globalThis.ChaturangaLessonEngine.getCurrentStepData()||{};
  const el=document.getElementById('lsBoard');
  if(!el) return;
  el.innerHTML='';
  const highlights=step.highlight||[];

  for(let r=8;r>=1;r--){
    for(let f=0;f<8;f++){
      const sq=String.fromCodePoint(97+f)+r;
      const cell=document.createElement('div');
      cell.className=`ls-sq ${(f+r)%2===0?'light':'dark'}`;
      if(highlights.includes(sq)) cell.classList.add('highlight');
      if(hinting && highlights.includes(sq)) cell.classList.add('hinting');
      if(selectedSq===sq) cell.classList.add('selected');

      const piece=boardMap.get(sq);
      if(piece){
        const img=document.createElement('img');
        img.className='ls-piece';
        const typeStr=(PIECE_NAMES[piece.type]||piece.type).toLowerCase();
        img.src=`../../images/pieces/${PLAYER_COLORS[piece.owner]}_${typeStr}.webp`;
        img.onerror=()=>{
          img.style.display='none';
          const span=document.createElement('span');
          span.style.fontSize='calc(var(--sq)*.55)';
          span.textContent=PIECE_SYMBOLS[piece.type]||'?';
          cell.appendChild(span);
        };
        cell.appendChild(img);
      }
      cell.onclick=()=>onBoardClick(sq);
      el.appendChild(cell);
    }
  }
  drawArrows(hinting?(step.arrows||[]):[]);
}

function sqCenter(sq){
  const f=sq.charCodeAt(0)-97, r=parseInt(sq.slice(1));
  const col=f, row=8-r;
  const s=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sq'))||56;
  return {x:col*s+s/2, y:row*s+s/2};
}
function drawArrows(arrows){
  const svg=document.getElementById('boardArrows');
  if(!svg) return;
  const s=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sq'))||56;
  svg.setAttribute('width',s*8); svg.setAttribute('height',s*8);
  svg.innerHTML=`<defs><marker id="arrhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--gold)"/></marker></defs>`;
  arrows.forEach(a=>{
    const p1=sqCenter(a.from), p2=sqCenter(a.to);
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',p1.x); line.setAttribute('y1',p1.y);
    line.setAttribute('x2',p2.x); line.setAttribute('y2',p2.y);
    line.setAttribute('stroke','var(--gold)'); line.setAttribute('stroke-width','4');
    line.setAttribute('stroke-linecap','round'); line.setAttribute('opacity','.85');
    line.setAttribute('marker-end','url(#arrhead)');
    svg.appendChild(line);
  });
}

function onBoardClick(sq){
  const stepData=globalThis.ChaturangaLessonEngine.getCurrentStepData();
  if(!stepData) return;

  if(stepData.allowAnyMove){
    handleResult(globalThis.ChaturangaLessonEngine.validatePlayerMove(sq,sq));
    return;
  }

  if(selectedSq){
    if(selectedSq===sq){ selectedSq=null; renderBoard(); return; }
    attemptMove(selectedSq,sq);
    return;
  }

  const piece=boardMap.get(sq);
  if(piece && piece.owner===0){ selectedSq=sq; renderBoard(); }
}

function attemptMove(from,to){
  const piece=boardMap.get(from);
  boardMap.set(to,piece); boardMap.delete(from);

  const res=globalThis.ChaturangaLessonEngine.validatePlayerMove(from,to);
  if(!res.valid){ boardMap.set(from,piece); boardMap.delete(to); }

  selectedSq=null; hinting=false;
  handleResult(res);
  renderBoard();
}

function handleResult(res){
  if(!res) return;
  const statusEl=document.getElementById('statusEl');
  const l=activeLesson;
  if(res.valid){
    statusEl.textContent=res.successMessage||'Correct!';
    statusEl.className='ls-status correct';
    if(res.complete){
      globalThis.ChaturangaLessonEngine.saveProgress(l.id,true);
      document.getElementById('chapLabel').textContent=`Chapter ${l.steps.length}/${l.steps.length} · Complete`;
      document.getElementById('chapBar').style.width='100%';

      const badgeEl=document.getElementById('badgePanel');
      badgeEl.style.display='block';
      const nxt=globalThis.ChaturangaLessonEngine.getNextLesson(l.id);
      badgeEl.innerHTML=
        '<i class="fa-solid fa-award" style="font-size:1.6rem;color:var(--gold);display:block;margin-bottom:6px"></i>'+
        '<span class="badge-pill">'+res.badge+'</span>'+
        (res.moralLesson?'<div class="moral-text">📜 '+res.moralLesson+'</div>':'')+
        (nxt?`<a class="next-lesson-btn" href="#/lesson/${nxt.id}">Continue: ${nxt.title} <i class="fa-solid fa-arrow-right"></i></a>`
             :`<a class="next-lesson-btn" href="#/topic/${l.category}">Back to ${TOPIC_META[l.category]?.label||l.category} <i class="fa-solid fa-check"></i></a>`);
    } else if(res.nextStep){
      showStep(res.nextStep);
    }
  } else {
    statusEl.textContent=res.wrongMessage||'Try again.';
    statusEl.className='ls-status wrong';
  }
}

route();
</script>
</body>
</html>
