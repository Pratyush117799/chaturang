<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Chaturanga Lessons — v1.2.0</title>
  <meta name="description" content="Learn Chaturanga through 18 interactive lessons rooted in Indian philosophy — Mahabharata, Bhagavad Gita, Panchatantra, Ramayana and Chanakya Niti."/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="../../css/styles.css"/>
  <link rel="stylesheet" href="../../css/animations.css"/>
  <link rel="stylesheet" href="../../css/themes.css"/>
  <script>(function(){var t=localStorage.getItem('chaturanga_theme');if(t&&t!=='classic')document.documentElement.className='theme-'+t;})();</script>
  <style>
    :root{--sq:52px}

    /* ============ PAGE LAYOUT (document, not app-shell) ============ */
    .lessons-layout{max-width:1120px;margin:0 auto;padding:32px 20px 100px;display:grid;grid-template-columns:1fr 220px;gap:40px;align-items:start}
    .ls-main{min-width:0}
    .ls-right{position:sticky;top:16px;padding:16px;border:1px solid var(--border,rgba(201,168,76,.18));border-radius:10px;background:var(--dark2,#17130a);max-height:calc(100vh - 32px);overflow-y:auto; margin-top: 40px;}

    /* ============ TABLE OF CONTENTS ============ */
    .toc-card{border:1px solid var(--border,rgba(201,168,76,.25));border-radius:12px;padding:28px 30px;margin-bottom:56px;background:rgba(201,168,76,.03); margin-top: 36px;}
    .toc-title{font-family:'Cinzel',serif;font-size:1.5rem;color:var(--gold,#c9a84c);margin:0 0 4px;text-align:center}
    .toc-sub{text-align:center;font-size:.8rem;color:#9a9284;font-style:italic;margin-bottom:22px}
    .toc-part{margin-bottom:16px}
    .toc-part:last-child{margin-bottom:0}
    .toc-part-title{font-family:'Cinzel',serif;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#8b8370;display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .toc-part-title .divider{flex:1;height:1px;background:var(--border,rgba(201,168,76,.18))}
    .toc-row{display:flex;align-items:baseline;gap:8px;padding:5px 2px;text-decoration:none;color:var(--text,#e3dcc9);font-size:.86rem;border-radius:4px;transition:background .15s}
    .toc-row:hover{background:rgba(201,168,76,.08)}
    .toc-row .toc-num{color:#6d6656;font-size:.78rem;width:1.6em;flex-shrink:0}
    .toc-row .toc-name{flex-shrink:0}
    .toc-row .toc-fill{flex:1;border-bottom:1px dotted rgba(201,168,76,.25);margin:0 6px;transform:translateY(-3px)}
    .toc-row .toc-diff{font-size:.68rem;color:#888;text-transform:uppercase;flex-shrink:0}
    .toc-row.completed .toc-name{color:#4ade80}
    .toc-row .toc-check{color:#4ade80;width:1em;flex-shrink:0}

    /* ============ CHAPTERS (center document) ============ */
    .chapters{max-width:660px;margin:0 auto}
    .part-divider{display:flex;align-items:center;gap:14px;margin:64px 0 34px}
    .part-divider:first-child{margin-top:0}
    .part-divider .line{flex:1;height:1px;background:var(--border,rgba(201,168,76,.18))}
    .part-divider .label{font-family:'Cinzel',serif;font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--gold,#c9a84c);white-space:nowrap}

    .chapter{margin-bottom:64px;scroll-margin-top:20px}
    .chapter-num{font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:#8b8370;margin-bottom:8px}

    .doc-header{border-bottom:2px solid var(--gold,#c9a84c);padding-bottom:16px;margin-bottom:22px}
    .doc-title{font-family:'Cinzel',serif;font-size:1.6rem;color:var(--gold,#c9a84c);margin:0 0 6px;line-height:1.25}
    .doc-culture{font-size:.8rem;color:#9a9284;font-style:italic;margin-bottom:10px}
    .doc-badges{display:flex;gap:8px;flex-wrap:wrap}
    .doc-badge{font-size:.66rem;text-transform:uppercase;letter-spacing:.04em;padding:3px 10px;border-radius:10px;border:1px solid var(--border,rgba(201,168,76,.25));color:var(--gold,#c9a84c);background:rgba(201,168,76,.06)}

    .doc-description{font-size:.92rem;line-height:1.75;color:var(--text,#e3dcc9);background:rgba(255,255,255,.02);border-left:2px solid var(--gold,#c9a84c);padding:4px 0 4px 18px;margin-bottom:26px}

    .doc-tutorial{background:rgba(201,168,76,.035);border:1px solid var(--border,rgba(201,168,76,.16));border-radius:10px;padding:20px;display:flex;flex-direction:column;align-items:center}

    .narration-bubble{background:rgba(201,168,76,.1);border:1px solid var(--gold,#c9a84c);border-radius:8px;padding:12px 16px;font-size:.84rem;color:var(--text,#e8e0d0);max-width:480px;width:100%;margin-bottom:10px;line-height:1.6}
    .instruction-box{background:rgba(255,255,255,.04);border:1px solid var(--border,rgba(201,168,76,.18));border-radius:6px;padding:8px 12px;font-size:.78rem;color:var(--gold,#c9a84c);max-width:480px;width:100%;margin-bottom:8px}
    .ls-status{font-size:.88rem;min-height:26px;font-weight:600;margin-bottom:6px}
    .ls-status.correct{color:#4ade80}.ls-status.wrong{color:#f87171}

    /* ============ BOARD ============ */
    .ls-board{display:grid;grid-template-columns:repeat(8,var(--sq));margin:10px 0}
    .ls-sq{width:var(--sq);height:var(--sq);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:background .15s}
    .ls-sq.light{background:#f0d9b5}.ls-sq.dark{background:#b58863}
    .ls-sq.highlight{outline:3px solid var(--gold,#c9a84c);outline-offset:-3px;box-shadow:inset 0 0 10px rgba(201,168,76,.3)}
    .ls-sq.selected{background:rgba(201,168,76,.5) !important}
    .ls-sq.legal-move::after{content:'';width:30%;height:30%;background:rgba(0,0,0,.3);border-radius:50%;display:block}
    .ls-piece{width:80%;height:80%;object-fit:contain;pointer-events:none}

    .badge-pill{display:inline-block;background:linear-gradient(135deg,#c9a84c,#f0cc7a);color:#1a1306;border-radius:12px;padding:3px 12px;font-size:.72rem;font-weight:700;margin-top:6px}

    .chapter-continue{margin-top:16px;background:none;border:1px solid var(--border,rgba(201,168,76,.3));color:var(--gold,#c9a84c);border-radius:8px;padding:7px 20px;font-size:.8rem;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
    .chapter-continue:hover{background:rgba(201,168,76,.08)}

    /* ============ RIGHT PANEL ============ */
    .progress-tree{display:flex;flex-direction:column;gap:4px;margin-top:8px}
    .pt-cat{font-size:.7rem;color:#888;display:flex;align-items:center;gap:6px;margin-bottom:2px}
    .pt-ring{width:12px;height:12px;border-radius:50%;border:2px solid var(--border,rgba(201,168,76,.18));display:inline-block}
    .pt-ring.done{border-color:#4ade80;background:#4ade80}
    .wisdom-card{background:rgba(201,168,76,.06);border:1px solid var(--border,rgba(201,168,76,.18));border-radius:6px;padding:8px 10px;margin-bottom:8px}
    .wisdom-source{font-size:.68rem;color:#888;font-style:italic;margin-bottom:3px}
    .wisdom-text{font-size:.75rem;color:var(--text,#e8e0d0);line-height:1.5}

    @media(max-width:900px){.lessons-layout{grid-template-columns:1fr}.ls-right{position:static;max-height:none;margin-top:40px}}
  </style>
</head>
<body>
<nav class="top-nav" style="display:flex;align-items:center;justify-content:space-between;padding:0 16px">
  <a href="../../" class="nav-logo" style="text-decoration:none;display:flex;align-items:center;gap:8px">
    <i class="fa-solid fa-graduation-cap" style="color:var(--gold,#c9a84c)"></i>
    <span style="font-family:'Cinzel',serif;color:var(--gold,#c9a84c)">Chaturanga Lessons</span>
    <span class="nav-version">v1.2.0</span>
  </a>
  <div style="display:flex;gap:10px">
    <a href="../../lessons/vyuha-formations.html" class="nav-icon-btn" title="Vyuha Formations" style="text-decoration:none"><i class="fa-brands fa-pagelines"></i></a>
    <a id="acharyaLink" href="../../lessons/acharya.html" class="nav-icon-btn" title="Ask Acharya" style="text-decoration:none"><i class="fa-solid fa-chalkboard-user"></i></a>
    <a href="puzzles.html" class="nav-icon-btn" title="Puzzles" style="text-decoration:none"><i class="fa-solid fa-puzzle-piece"></i></a>
    <a href="../../" class="nav-icon-btn" title="Tournament" style="text-decoration:none"><i class="fa-solid fa-trophy"></i></a>
    <a href="../../" class="nav-icon-btn" title="Game" style="text-decoration:none"><i class="fa-solid fa-chess-board"></i></a>
  </div>
</nav>

<div class="lessons-layout">
  <!-- MAIN: one continuous document — TOC, then every lesson as a chapter -->
  <main class="ls-main">

    <div class="toc-card">
      <h1 class="toc-title">Chaturanga Lessons</h1>
      <p class="toc-sub">Eighteen lessons in the ancient game, rooted in Indian philosophy and history</p>
      <div id="toc"></div>
    </div>

    <div id="chapters" class="chapters"></div>

  </main>

  <!-- RIGHT: Progress & Wisdom (not lesson navigation — just a reading tracker) -->
  <aside class="ls-right" aria-label="Progress Sidebar">
    <h4 class="section-label"><i class="fa-solid fa-sitemap"></i> Progress</h4>
    <div id="progressTree" class="progress-tree"></div>
    <hr style="border-color:var(--border,rgba(201,168,76,.18));margin:12px 0"/>
    <h4 class="section-label"><i class="fa-solid fa-om"></i> Cultural Wisdom</h4>
    <div id="wisdomUnlocks"><p style="font-size:.75rem;color:#888">Complete lessons to unlock wisdom from ancient texts.</p></div>
  </aside>
</div>

<script src="../../lessons/lesson-data.js"></script>
<script src="../../lessons/lesson-engine.js"></script>
<script>
const PIECE_SYMBOLS={pawn:'♟',horse:'♞',elephant:'♝',rook:'♜',king:'♚'};
const PLAYER_COLORS=['red','blue','green','yellow'];
const PIECE_NAMES={pawn:'Nara',horse:'Ashwa',elephant:'Danti',rook:'Ratha',king:'Raja'};
const CAT_ICONS={basics:'fa-chess-pawn',opening:'fa-arrow-up-right-dots',tactics:'fa-crosshairs',endgame:'fa-flag-checkered',alliance:'fa-handshake',advanced:'fa-brain'};

// Per-lesson state (independent board + selection), since every chapter is on screen at once.
const lsBoardMaps=new Map();   // lessonId -> Map(sq -> {owner,type})
const lsSelected=new Map();    // lessonId -> selected square | null
let engineActiveId=null;       // which lesson currently "owns" the shared engine session

function defaultBoard(){
  return {
    'a1':{owner:0,type:'rook'}, 'e1':{owner:0,type:'king'},
    'h8':{owner:1,type:'king'}, 'h7':{owner:1,type:'rook'}
  };
}

function freshBoardMap(l){
  const boardDef = l.boardState || defaultBoard();
  const map=new Map();
  Object.entries(boardDef).forEach(([sq,v])=>{
    map.set(sq, typeof v==='string'
      ? (([o,t])=>({owner:parseInt(o),type:t}))(v.split(':'))
      : v);
  });
  return map;
}

function buildPage(){
  const lessons=globalThis.ChaturangaLessonData||[];
  const cats=[...new Set(lessons.map(l=>l.category))];

  buildTOC(cats,lessons);
  buildChapters(cats,lessons);
  buildProgressTree();
  buildWisdom();
}

function buildTOC(cats,lessons){
  const el=document.getElementById('toc');
  el.innerHTML='';
  let n=0;
  cats.forEach(cat=>{
    const catLessons=lessons.filter(l=>l.category===cat);
    const part=document.createElement('div');part.className='toc-part';
    part.innerHTML='<div class="toc-part-title"><i class="fa-solid '+CAT_ICONS[cat]+' fa-xs"></i>'+cat.charAt(0).toUpperCase()+cat.slice(1)+'<span class="divider"></span></div>';
    catLessons.forEach(l=>{
      n++;
      const done=globalThis.ChaturangaLessonEngine.isCompleted(l.id);
      const row=document.createElement('a');
      row.href='#lesson-'+l.id;
      row.className='toc-row'+(done?' completed':'');
      row.innerHTML='<span class="toc-num">'+n+'.</span>'+
        '<span class="toc-name">'+l.title+'</span>'+
        '<span class="toc-fill"></span>'+
        (done?'<i class="fa-solid fa-check toc-check"></i>':'')+
        '<span class="toc-diff">'+l.difficulty+'</span>';
      part.appendChild(row);
    });
    el.appendChild(part);
  });
}

function buildChapters(cats,lessons){
  const el=document.getElementById('chapters');
  el.innerHTML='';
  let n=0;
  cats.forEach(cat=>{
    const catLessons=lessons.filter(l=>l.category===cat);

    const divider=document.createElement('div');divider.className='part-divider';
    divider.innerHTML='<span class="line"></span><span class="label">'+cat.charAt(0).toUpperCase()+cat.slice(1)+'</span><span class="line"></span>';
    el.appendChild(divider);

    catLessons.forEach(l=>{
      n++;
      lsBoardMaps.set(l.id, freshBoardMap(l));
      lsSelected.set(l.id, null);
      el.appendChild(renderChapter(l,n));
    });
  });
}

function renderChapter(l, chapterNum){
  const sec=document.createElement('section');
  sec.id='lesson-'+l.id;
  sec.className='chapter';
  sec.innerHTML=
    '<div class="chapter-num">Chapter '+chapterNum+'</div>'+
    '<header class="doc-header">'+
      '<h2 class="doc-title">'+l.title+'</h2>'+
      '<div class="doc-culture">'+(l.culturalSource||'')+'</div>'+
      '<div class="doc-badges">'+
        '<span class="doc-badge">'+(l.difficulty||'')+'</span>'+
        '<span class="doc-badge">'+(l.category||'')+'</span>'+
      '</div>'+
    '</header>'+
    '<p class="doc-description">'+(l.description||l.culturalSource||'')+'</p>'+
    '<div class="doc-tutorial">'+
      '<div class="narration-bubble" id="narr-'+l.id+'"></div>'+
      '<div class="instruction-box" id="inst-'+l.id+'"></div>'+
      '<div class="ls-status" id="status-'+l.id+'"></div>'+
      '<div class="ls-board" id="board-'+l.id+'"></div>'+
      '<div id="badge-'+l.id+'" style="display:none;text-align:center;margin-top:12px"></div>'+
      '<a href="#lesson-'+l.id+'-next" class="chapter-continue" id="continue-'+l.id+'" style="display:none">Continue reading <i class="fa-solid fa-arrow-down"></i></a>'+
    '</div>';

  // Fill in narration/instruction from the lesson's first step and draw the board.
  const step=l.steps && l.steps[0];
  if(step){
    sec.querySelector('#narr-'+l.id).textContent=step.narration||'';
    sec.querySelector('#inst-'+l.id).innerHTML='<i class="fa-solid fa-arrow-right" style="color:var(--gold,#c9a84c)"></i> '+(step.instruction||'');
  }
  renderLsBoard(l, step, sec.querySelector('#board-'+l.id));
  return sec;
}

function renderLsBoard(l, step, container){
  const el=container||document.getElementById('board-'+l.id);
  if(!el) return;
  el.innerHTML='';
  const highlights=step?.highlight||[];
  const boardMap=lsBoardMaps.get(l.id);
  const selectedSq=lsSelected.get(l.id);

  for(let r=8;r>=1;r--){
    for(let f=0;f<8;f++){
      const sq=String.fromCodePoint(97+f)+r;
      const cell=document.createElement('div');
      cell.className=`ls-sq ${(f+r)%2===0?'light':'dark'}`;
      if(highlights.includes(sq)) cell.classList.add('highlight');
      if(selectedSq===sq) cell.classList.add('selected');

      const piece=boardMap.get(sq);
      if(piece){
        const img=document.createElement('img');
        img.className='ls-piece';
        const typeStr=(PIECE_NAMES[piece.type]||piece.type).toLowerCase();
        img.src=`images/pieces/${PLAYER_COLORS[piece.owner]}_${typeStr}.webp`;
        img.onerror=()=>{
          img.style.display='none';
          const span=document.createElement('span');
          span.style.fontSize='calc(var(--sq)*.55)';
          span.textContent=PIECE_SYMBOLS[piece.type]||'?';
          cell.appendChild(span);
        };
        cell.appendChild(img);
      }
      cell.onclick=()=>onLsClick(l,sq);
      el.appendChild(cell);
    }
  }
}

// Make sure the shared engine session belongs to this lesson before validating a move
// against it. Switching chapters restarts that chapter's exercise from step one.
function ensureEngineOwns(l){
  if(engineActiveId===l.id) return;
  globalThis.ChaturangaLessonEngine.startLesson(l);
  engineActiveId=l.id;
  lsBoardMaps.set(l.id, freshBoardMap(l));
  lsSelected.set(l.id, null);
  const step=l.steps && l.steps[0];
  showStep(l, step);
  renderLsBoard(l, step);
}

function showStep(l, step){
  if(!step) return;
  document.getElementById('narr-'+l.id).textContent=step.narration||'';
  document.getElementById('inst-'+l.id).innerHTML='<i class="fa-solid fa-arrow-right" style="color:var(--gold,#c9a84c)"></i> '+(step.instruction||'');
  document.getElementById('status-'+l.id).textContent='';
}

function attemptLsMove(l, from, to){
  const boardMap=lsBoardMaps.get(l.id);
  const piece=boardMap.get(from);
  boardMap.set(to,piece);
  boardMap.delete(from);

  const res=globalThis.ChaturangaLessonEngine.validatePlayerMove(from,to);
  if(!res.valid){
    boardMap.set(from,piece);
    boardMap.delete(to);
  }

  lsSelected.set(l.id,null);
  handleLsResult(l,res);
  renderLsBoard(l, globalThis.ChaturangaLessonEngine.getCurrentStepData()||{});
}

function onLsClick(l, sq){
  ensureEngineOwns(l);
  const stepData=globalThis.ChaturangaLessonEngine.getCurrentStepData();
  if(!stepData) return;

  if(stepData.allowAnyMove){
    handleLsResult(l, globalThis.ChaturangaLessonEngine.validatePlayerMove(sq,sq));
    return;
  }

  const selectedSq=lsSelected.get(l.id);
  if(selectedSq){
    if(selectedSq===sq){
      lsSelected.set(l.id,null);
      renderLsBoard(l,stepData);
    } else {
      attemptLsMove(l,selectedSq,sq);
    }
    return;
  }

  const piece=lsBoardMaps.get(l.id).get(sq);
  if(piece && piece.owner===0){
    lsSelected.set(l.id,sq);
    renderLsBoard(l,stepData);
  }
}

function handleLsResult(l, res){
  if(!res) return;
  const statusEl=document.getElementById('status-'+l.id);
  if(res.valid){
    statusEl.textContent=res.successMessage||'Correct!';
    statusEl.className='ls-status correct';
    if(res.complete){
      globalThis.ChaturangaLessonEngine.saveProgress(l.id,true);

      const badgeEl=document.getElementById('badge-'+l.id);
      badgeEl.style.display='block';
      badgeEl.innerHTML=
        '<i class="fa-solid fa-award" style="font-size:1.5rem;color:var(--gold,#c9a84c);display:block;margin-bottom:6px"></i>'+
        '<span class="badge-pill">'+res.badge+'</span>'+
        (res.moralLesson?'<div style="margin-top:10px;font-size:.8rem;color:#ccc;font-style:italic;max-width:400px">📜 '+res.moralLesson+'</div>':'');

      const tocRow=document.querySelector('a.toc-row[href="#lesson-'+l.id+'"]');
      if(tocRow && !tocRow.classList.contains('completed')){
        tocRow.classList.add('completed');
        if(!tocRow.querySelector('.toc-check')){
          const check=document.createElement('i');
          check.className='fa-solid fa-check toc-check';
          tocRow.insertBefore(check, tocRow.querySelector('.toc-diff'));
        }
      }

      const nxt=globalThis.ChaturangaLessonEngine.getNextLesson(l.id);
      const contBtn=document.getElementById('continue-'+l.id);
      if(nxt && contBtn){
        contBtn.style.display='inline-flex';
        contBtn.innerHTML='Continue to: '+nxt.title+' <i class="fa-solid fa-arrow-down"></i>';
        contBtn.href='#lesson-'+nxt.id;
      }

      buildProgressTree(); buildWisdom();
    } else if(res.nextStep){
      showStep(l, res.nextStep);
      renderLsBoard(l, res.nextStep);
    }
  } else {
    statusEl.textContent=res.wrongMessage||'Try again.';
    statusEl.className='ls-status wrong';
  }
}

function buildProgressTree(){
  const el=document.getElementById('progressTree');
  const lessons=globalThis.ChaturangaLessonData||[];
  const cats=[...new Set(lessons.map(l=>l.category))];
  el.innerHTML='';
  cats.forEach(cat=>{
    const catLessons=lessons.filter(l=>l.category===cat);
    const doneCount=catLessons.filter(l=>globalThis.ChaturangaLessonEngine.isCompleted(l.id)).length;
    const row=document.createElement('div');row.className='pt-cat';
    row.innerHTML='<i class="fa-solid '+CAT_ICONS[cat]+' fa-xs"></i><span>'+cat.charAt(0).toUpperCase()+cat.slice(1)+'</span>';
    catLessons.forEach(l=>{
      const ring=document.createElement('span');ring.className='pt-ring';
      if(globalThis.ChaturangaLessonEngine.isCompleted(l.id)) ring.classList.add('done');
      ring.title=l.title;
      row.appendChild(ring);
    });
    row.innerHTML+='<span style="margin-left:auto;font-size:.65rem;color:#888">'+doneCount+'/'+catLessons.length+'</span>';
    el.appendChild(row);
  });
}

function buildWisdom(){
  const el=document.getElementById('wisdomUnlocks');
  const wisdom=globalThis.ChaturangaLessonEngine.getUnlockedWisdom();
  if(!wisdom.length){el.innerHTML='<p style="font-size:.75rem;color:#888">Complete lessons to unlock wisdom from ancient texts.</p>';return;}
  el.innerHTML=wisdom.map(w=>'<div class="wisdom-card"><div class="wisdom-source">'+w.source+'</div><div class="wisdom-text">'+w.lesson+'</div></div>').join('');
}

buildPage();
</script>
</body>
