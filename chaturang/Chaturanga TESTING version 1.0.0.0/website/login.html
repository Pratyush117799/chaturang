<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chaturanga - Login & Register</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Noto+Sans+Devanagari:wght@400;600&family=Raleway:wght@400;500;600&family=Yatra+One&display=swap" rel="stylesheet">

  <style>
    /* =====================================================
       CSS VARIABLES & BASE RESET
       ===================================================== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --maroon: #3d0b0b;
      --maroon-mid: #5c1a1a;
      --crimson: #8b1a1a;
      --gold: #c9a84c;
      --gold-light: #e8cc80;
      --gold-dim: #8a6e2f;
      --sandstone: #e8d5a3;
      --parchment: #f4ead0;
      --midnight: #120400;
      --dark-bg: #1a0600;
      --text: #f4ead0;
      --text-muted: #c9b890;
      --text-dark: #2a0e0e;
      --border-gold: 1px solid rgba(201, 168, 76, 0.3);
      --radius: 12px;
      --radius-lg: 20px;
      --shadow-gold: 0 0 30px rgba(201, 168, 76, 0.15);
      --shadow-deep: 0 8px 40px rgba(0, 0, 0, 0.6);
      --font-display: 'Cinzel', serif;
      --font-deva: 'Noto Sans Devanagari', sans-serif;
      --font-body: 'Raleway', sans-serif;
      --font-yatra: 'Yatra One', cursive;
      --transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html, body {
      overscroll-behavior-y: contain;
      height: 100%;
      width: 100%;
    }

    body {
      font-family: var(--font-body);
      background: var(--dark-bg);
      color: var(--text);
      overflow-x: hidden;
      line-height: 1.6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
    }

    /* Ambient Background Glow */
    body::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(201, 168, 76, 0.12) 0%, rgba(61, 11, 11, 0.3) 40%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    /* =====================================================
       AUTH CONTAINER & CARD
       ===================================================== */
    .auth-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px;
      padding: 20px;
    }

    .auth-card {
      background: rgba(26, 6, 0, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: var(--border-gold);
      border-radius: var(--radius-lg);
      padding: 40px 32px;
      box-shadow: var(--shadow-deep), var(--shadow-gold);
      contain: layout paint;
      position: relative;
      overflow: hidden;
    }

    /* Decorative Top Gold Line */
    .auth-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent);
    }

    /* Header & Branding */
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-container {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      text-decoration: none;
    }

    .logo-devanagari {
      font-family: var(--font-yatra);
      font-size: 1.8rem;
      color: var(--gold);
      text-shadow: 0 0 15px rgba(201, 168, 76, 0.4);
    }

    .logo-divider {
      color: var(--gold-dim);
      font-size: 1.2rem;
    }

    .logo-latin {
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--sandstone);
      letter-spacing: 2px;
    }

    .auth-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* Tab Switcher */
    .tab-switcher {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(201, 168, 76, 0.2);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 28px;
    }

    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      padding: 10px;
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 7px;
      transition: var(--transition);
      min-height: 40px;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
      color: var(--midnight);
      box-shadow: 0 2px 10px rgba(201, 168, 76, 0.3);
    }

    /* Form Views */
    .form-view {
      display: none;
      animation: fadeIn 0.35s ease forwards;
    }

    .form-view.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Input Fields */
    .input-group {
      margin-bottom: 20px;
      position: relative;
    }

    .input-label {
      display: block;
      font-family: var(--font-display);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--sandstone);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-field {
      width: 100%;
      background: rgba(18, 4, 0, 0.6);
      border: 1px solid rgba(201, 168, 76, 0.25);
      border-radius: 8px;
      padding: 12px 16px;
      padding-right: 42px;
      font-family: var(--font-body);
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      transition: var(--transition);
    }

    .input-field::placeholder {
      color: rgba(201, 184, 144, 0.4);
    }

    .input-field:focus {
      border-color: var(--gold);
      box-shadow: 0 0 15px rgba(201, 168, 76, 0.25);
      background: rgba(18, 4, 0, 0.85);
    }

    /* Toggle Password Button */
    .toggle-password {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--gold-dim);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 4px;
      transition: var(--transition);
    }

    .toggle-password:hover {
      color: var(--gold);
    }

    /* Helper Links & Options */
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 0.8rem;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: var(--text-muted);
    }

    .checkbox-container input {
      accent-color: var(--gold);
      cursor: pointer;
    }

    .forgot-link {
      color: var(--gold);
      text-decoration: none;
      font-family: var(--font-display);
      font-size: 0.7rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: var(--transition);
    }

    .forgot-link:hover {
      color: var(--gold-light);
      text-shadow: 0 0 8px rgba(201, 168, 76, 0.4);
    }

    /* Primary Action Button */
    .btn-submit {
      width: 100%;
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--midnight);
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
      border: none;
      border-radius: 8px;
      padding: 14px;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 20px rgba(201, 168, 76, 0.3);
      min-height: 48px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(201, 168, 76, 0.5);
    }

    .btn-submit:active {
      transform: translateY(0) scale(0.98);
    }

    /* Divider */
    .auth-divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
      color: var(--gold-dim);
      font-size: 0.75rem;
      font-family: var(--font-display);
      letter-spacing: 2px;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(201, 168, 76, 0.2);
    }

    .auth-divider span {
      padding: 0 12px;
    }

    /* Back to Login Text */
    .back-login {
      text-align: center;
      margin-top: 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .back-login button {
      background: none;
      border: none;
      color: var(--gold);
      font-family: var(--font-display);
      font-size: 0.8rem;
      cursor: pointer;
      letter-spacing: 1px;
      text-decoration: underline;
    }

    /* Responsive Tweaks */
    @media (max-width: 480px) {
      .auth-card {
        padding: 30px 20px;
      }
      .logo-devanagari {
        font-size: 1.5rem;
      }
      .logo-latin {
        font-size: 1.1rem;
      }
    }

    /* Reduced Motion preference */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">

      <!-- Header / Logo -->
      <div class="auth-header">
        <a href="#" class="logo-container">
          <span class="logo-devanagari">चतुरंग</span>
          <span class="logo-divider">|</span>
          <span class="logo-latin">CHATURANGA</span>
        </a>
        <p class="auth-subtitle">Enter the Ancient Battlefield</p>
      </div>

      <!-- Tab Navigation (Login / Sign Up) -->
      <div class="tab-switcher" id="tab-switcher">
        <button class="tab-btn active" onclick="switchTab('login')">Sign In</button>
        <button class="tab-btn" onclick="switchTab('signup')">Register</button>
      </div>

      <!-- 1. LOGIN FORM -->
      <form id="login-form" class="form-view active" onsubmit="handleAuth(event, 'Login')">
        <div class="input-group">
          <label class="input-label" for="login-email">Warrior ID / Email</label>
          <div class="input-wrapper">
            <input type="text" id="login-email" class="input-field" placeholder="warrior@chaturanga.in" required>
          </div>
        </div>

        <div class="input-group">
          <label class="input-label" for="login-password">Passcode</label>
          <div class="input-wrapper">
            <input type="password" id="login-password" class="input-field" placeholder="••••••••" required>
            <button type="button" class="toggle-password" onclick="togglePasswordVisibility('login-password', this)">👁</button>
          </div>
        </div>

        <div class="form-options">
          <label class="checkbox-container">
            <input type="checkbox" checked>
            <span>Remember Me</span>
          </label>
          <a href="#" class="forgot-link" onclick="switchTab('forgot')">Forgot Code?</a>
        </div>

        <button type="submit" class="btn-submit">Enter Realm</button>
      </form>

      <!-- 2. SIGNUP FORM -->
      <form id="signup-form" class="form-view" onsubmit="handleAuth(event, 'Account Creation')">
        <div class="input-group">
          <label class="input-label" for="signup-name">Warrior Title / Name</label>
          <div class="input-wrapper">
            <input type="text" id="signup-name" class="input-field" placeholder="e.g. Arjun Dev" required>
          </div>
        </div>

        <div class="input-group">
          <label class="input-label" for="signup-email">Email Address</label>
          <div class="input-wrapper">
            <input type="email" id="signup-email" class="input-field" placeholder="warrior@chaturanga.in" required>
          </div>
        </div>

        <div class="input-group">
          <label class="input-label" for="signup-password">Secret Passcode</label>
          <div class="input-wrapper">
            <input type="password" id="signup-password" class="input-field" placeholder="At least 8 characters" required minlength="8">
            <button type="button" class="toggle-password" onclick="togglePasswordVisibility('signup-password', this)">👁</button>
          </div>
        </div>

        <div class="form-options">
          <label class="checkbox-container">
            <input type="checkbox" required>
            <span>Accept Rules of Engagement</span>
          </label>
        </div>

        <button type="submit" class="btn-submit">Pledge Allegiance</button>
      </form>

      <!-- 3. FORGOT PASSWORD FORM -->
      <form id="forgot-form" class="form-view" onsubmit="handleAuth(event, 'Password Reset')">
        <div class="input-group">
          <label class="input-label" for="forgot-email">Registered Email Address</label>
          <div class="input-wrapper">
            <input type="email" id="forgot-email" class="input-field" placeholder="warrior@chaturanga.in" required>
          </div>
        </div>

        <button type="submit" class="btn-submit">Send Recovery Seal</button>

        <div class="back-login">
          Remembered? <button type="button" onclick="switchTab('login')">Return to Sign In</button>
        </div>
      </form>

    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // Tab Switching Logic
    function switchTab(target) {
      const switcher = document.getElementById('tab-switcher');
      const tabs = switcher.querySelectorAll('.tab-btn');
      const forms = document.querySelectorAll('.form-view');

      // Hide/Show tab switcher bar depending on whether user is on Forgot Password or main tabs
      if (target === 'forgot') {
        switcher.style.display = 'none';
      } else {
        switcher.style.display = 'flex';
      }

      // Activate corresponding tab button highlight
      tabs.forEach(tab => {
        if ((target === 'login' && tab.innerText.includes('SIGN IN')) || 
            (target === 'signup' && tab.innerText.includes('REGISTER'))) {
          tab.classList.add('active');
        } else {
          tab.classList.remove('active');
        }
      });

      // Show the requested form view
      forms.forEach(form => {
        form.classList.remove('active');
        if (form.id === `${target}-form`) {
          form.classList.add('active');
        }
      });
    }

    // Toggle Password Visibility
    function togglePasswordVisibility(fieldId, btn) {
      const input = document.getElementById(fieldId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.style.opacity = '1';
        btn.style.color = 'var(--gold)';
      } else {
        input.type = 'password';
        btn.style.opacity = '0.7';
        btn.style.color = 'var(--gold-dim)';
      }
    }

    // Simulated Auth Handler
    function handleAuth(event, actionName) {
      event.preventDefault();
      alert(`${actionName} submitted successfully! Ready for backend integration.`);
    }
  </script>
</body>
</html>
