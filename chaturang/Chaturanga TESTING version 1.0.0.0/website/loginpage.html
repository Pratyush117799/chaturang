<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chaturanga - Login & Register</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Noto+Sans+Devanagari:wght@400;600&family=Raleway:wght@400;500;600&family=Yatra+One&display=swap" rel="stylesheet">

  <style>
    /* =====================================================
       CSS VARIABLES & BASE RESET
       ===================================================== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --maroon: #3d0b0b;
      --maroon-mid: #5c1a1a;
      --crimson: #8b1a1a;
      --gold: #c9a84c;
      --gold-light: #e8cc80;
      --gold-dim: #8a6e2f;
      --sandstone: #e8d5a3;
      --parchment: #f4ead0;
      --midnight: #120400;
      --dark-bg: #1a0600;
      --text: #f4ead0;
      --text-muted: #c9b890;
      --text-dark: #2a0e0e;
      --error: #e05a5a;
      --border-gold: 1px solid rgba(201, 168, 76, 0.3);
      --radius: 12px;
      --radius-lg: 20px;
      --shadow-gold: 0 0 30px rgba(201, 168, 76, 0.15);
      --shadow-deep: 0 8px 40px rgba(0, 0, 0, 0.6);
      --font-display: 'Cinzel', serif;
      --font-deva: 'Noto Sans Devanagari', sans-serif;
      --font-body: 'Raleway', sans-serif;
      --font-yatra: 'Yatra One', cursive;
      --transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    html, body {
      overscroll-behavior-y: contain;
      height: 100%;
      width: 100%;
    }

    html {
      -webkit-text-size-adjust: 100%; /* stop iOS auto-zooming text on rotate */
      text-size-adjust: 100%;
    }

    body {
      font-family: var(--font-body);
      background: var(--dark-bg);
      color: var(--text);
      overflow-x: hidden;
      line-height: 1.6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh; /* accounts for mobile browser chrome */
      position: relative;
      padding: calc(16px + var(--safe-top)) calc(16px + var(--safe-right)) calc(16px + var(--safe-bottom)) calc(16px + var(--safe-left));
    }

    /* Ambient Background Glow — cheap radial gradient, no image request,
       promoted to its own layer so it never forces a repaint of the card */
    body::before {
      content: '';
      position: fixed;
      width: 560px;
      height: 560px;
      max-width: 140vw;
      max-height: 140vw;
      background: radial-gradient(circle, rgba(201, 168, 76, 0.12) 0%, rgba(61, 11, 11, 0.3) 40%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) translateZ(0);
      pointer-events: none;
      z-index: 0;
      will-change: transform;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* =====================================================
       AUTH CONTAINER & CARD
       ===================================================== */
    .auth-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
    }

    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--gold-dim);
      text-decoration: none;
      font-family: var(--font-display);
      font-size: 0.72rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 16px;
      padding: 6px 4px;
      min-height: 32px;
      transition: color 0.2s ease;
    }
    .back-home:hover { color: var(--gold); }

    .auth-card {
      background: rgba(26, 6, 0, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: var(--border-gold);
      border-radius: var(--radius-lg);
      padding: clamp(24px, 5vw, 40px) clamp(18px, 4vw, 32px);
      box-shadow: var(--shadow-deep), var(--shadow-gold);
      contain: layout paint;
      position: relative;
      overflow: hidden;
      transform: translateZ(0);
    }

    /* Backdrop blur is one of the priciest GPU ops on mid/low-end phones —
       halve it under the same breakpoint the rest of the site uses. */
    @media (max-width: 768px) {
      .auth-card {
        backdrop-filter: blur(7px);
        -webkit-backdrop-filter: blur(7px);
      }
    }

    /* Decorative Top Gold Line */
    .auth-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent);
    }

    /* Header & Branding */
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-container {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      text-decoration: none;
    }

    .logo-devanagari {
      font-family: var(--font-yatra);
      font-size: 1.8rem;
      color: var(--gold);
      text-shadow: 0 0 15px rgba(201, 168, 76, 0.4);
    }

    .logo-divider {
      color: var(--gold-dim);
      font-size: 1.2rem;
    }

    .logo-latin {
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--sandstone);
      letter-spacing: 2px;
    }

    .auth-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* Tab Switcher */
    .tab-switcher {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(201, 168, 76, 0.2);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 22px;
    }

    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      padding: 10px;
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 7px;
      transition: var(--transition);
      min-height: 44px;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
      color: var(--midnight);
      box-shadow: 0 2px 10px rgba(201, 168, 76, 0.3);
    }

    /* Inline alert banner — shown above the active form instead of alert() */
    .form-alert {
      display: none;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      line-height: 1.5;
      margin-bottom: 18px;
    }
    .form-alert.show { display: flex; animation: fadeIn 0.25s ease; }
    .form-alert.error {
      background: rgba(224, 90, 90, 0.12);
      border: 1px solid rgba(224, 90, 90, 0.4);
      color: #ffc2c2;
    }
    .form-alert.success {
      background: rgba(201, 168, 76, 0.12);
      border: 1px solid rgba(201, 168, 76, 0.4);
      color: var(--gold-light);
    }
    .form-alert .alert-icon { flex-shrink: 0; font-size: 0.95rem; line-height: 1.4; }

    /* Form Views */
    .form-view {
      display: none;
      animation: fadeIn 0.35s ease forwards;
    }

    .form-view.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Input Fields */
    .input-group {
      margin-bottom: 18px;
      position: relative;
    }

    .input-label {
      display: block;
      font-family: var(--font-display);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--sandstone);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-field {
      width: 100%;
      background: rgba(18, 4, 0, 0.6);
      border: 1px solid rgba(201, 168, 76, 0.25);
      border-radius: 8px;
      padding: 13px 16px;
      padding-right: 42px;
      font-family: var(--font-body);
      /* 16px minimum stops iOS Safari auto-zooming the page on focus */
      font-size: 16px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      min-height: 48px;
    }

    .input-field::placeholder {
      color: rgba(201, 184, 144, 0.4);
    }

    .input-field:focus {
      border-color: var(--gold);
      box-shadow: 0 0 15px rgba(201, 168, 76, 0.25);
      background: rgba(18, 4, 0, 0.85);
    }

    .input-field.invalid {
      border-color: var(--error);
      box-shadow: 0 0 10px rgba(224, 90, 90, 0.25);
    }

    .field-hint {
      display: none;
      font-size: 0.72rem;
      color: var(--error);
      margin-top: 6px;
    }
    .field-hint.show { display: block; }

    /* Toggle Password Button */
    .toggle-password {
      position: absolute;
      right: 6px;
      background: none;
      border: none;
      color: var(--gold-dim);
      cursor: pointer;
      font-size: 0.9rem;
      padding: 8px;
      min-width: 40px;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease;
    }

    .toggle-password:hover { color: var(--gold); }

    /* Helper Links & Options */
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 22px;
      font-size: 0.8rem;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: var(--text-muted);
      min-height: 32px;
    }

    .checkbox-container input {
      accent-color: var(--gold);
      cursor: pointer;
      width: 18px;
      height: 18px;
    }

    .forgot-link {
      color: var(--gold);
      text-decoration: none;
      font-family: var(--font-display);
      font-size: 0.7rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: color 0.2s ease;
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    .forgot-link:hover {
      color: var(--gold-light);
      text-shadow: 0 0 8px rgba(201, 168, 76, 0.4);
    }

    /* Primary Action Button */
    .btn-submit {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--midnight);
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
      border: none;
      border-radius: 8px;
      padding: 14px;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
      box-shadow: 0 4px 20px rgba(201, 168, 76, 0.3);
      min-height: 48px;
    }

    @media (hover: hover) and (pointer: fine) {
      .btn-submit:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 6px 25px rgba(201, 168, 76, 0.5);
      }
    }

    .btn-submit:active:not(:disabled) {
      transform: translateY(0) scale(0.98);
    }

    .btn-submit:disabled {
      cursor: not-allowed;
      opacity: 0.85;
    }

    .btn-submit .btn-label { transition: opacity 0.15s ease; }
    .btn-submit.loading .btn-label { opacity: 0; }

    .btn-spinner {
      display: none;
      position: absolute;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(18, 4, 0, 0.35);
      border-top-color: var(--midnight);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .btn-submit.loading .btn-spinner { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Back to Login Text */
    .back-login {
      text-align: center;
      margin-top: 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .back-login button {
      background: none;
      border: none;
      color: var(--gold);
      font-family: var(--font-display);
      font-size: 0.8rem;
      cursor: pointer;
      letter-spacing: 1px;
      text-decoration: underline;
      padding: 6px;
      min-height: 32px;
    }

    /* Responsive Tweaks */
    @media (max-width: 480px) {
      .auth-card {
        padding: 26px 18px;
      }
      .logo-devanagari { font-size: 1.5rem; }
      .logo-latin { font-size: 1.1rem; }
      .form-options { flex-direction: column; align-items: flex-start; }
    }

    @media (max-width: 360px) {
      .auth-card { padding: 22px 14px; }
      .tab-btn { font-size: 0.68rem; padding: 9px 4px; }
    }

    /* Short/landscape phones: let the page scroll instead of clipping */
    @media (max-height: 560px) {
      body { align-items: flex-start; }
      .auth-wrapper { margin: calc(20px + var(--safe-top)) auto calc(20px + var(--safe-bottom)); }
    }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <a href="index.html" class="back-home">← Back to the Battlefield</a>

    <div class="auth-card">

      <!-- Header / Logo -->
      <div class="auth-header">
        <a href="index.html" class="logo-container">
          <span class="logo-devanagari">चतुरंग</span>
          <span class="logo-divider">|</span>
          <span class="logo-latin">CHATURANGA</span>
        </a>
        <p class="auth-subtitle">Enter the Ancient Battlefield</p>
      </div>

      <!-- Shared inline alert (errors / success messages) -->
      <div class="form-alert" id="form-alert" role="alert" aria-live="polite">
        <span class="alert-icon" id="alert-icon">⚠</span>
        <span id="alert-text"></span>
      </div>

      <!-- Tab Navigation (Login / Sign Up) -->
      <div class="tab-switcher" id="tab-switcher">
        <button type="button" class="tab-btn active" data-tab="login" onclick="switchTab('login')">Sign In</button>
        <button type="button" class="tab-btn" data-tab="signup" onclick="switchTab('signup')">Register</button>
      </div>

      <!-- 1. LOGIN FORM -->
      <form id="login-form" class="form-view active" novalidate>
        <div class="input-group">
          <label class="input-label" for="login-email">Email</label>
          <div class="input-wrapper">
            <input type="email" id="login-email" class="input-field" placeholder="warrior@chaturanga.in"
                   autocomplete="email" inputmode="email" required>
          </div>
          <p class="field-hint" id="login-email-hint">Enter a valid email address.</p>
        </div>

        <div class="input-group">
          <label class="input-label" for="login-password">Passcode</label>
          <div class="input-wrapper">
            <input type="password" id="login-password" class="input-field" placeholder="••••••••"
                   autocomplete="current-password" required>
            <button type="button" class="toggle-password" aria-label="Show password" onclick="togglePasswordVisibility('login-password', this)">👁</button>
          </div>
          <p class="field-hint" id="login-password-hint">Passcode is required.</p>
        </div>

        <div class="form-options">
          <label class="checkbox-container">
            <input type="checkbox" id="remember-me" checked>
            <span>Remember Me</span>
          </label>
          <button type="button" class="forgot-link" onclick="switchTab('forgot')">Forgot Code?</button>
        </div>

        <button type="submit" class="btn-submit" id="login-submit">
          <span class="btn-label">Enter Realm</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>
      </form>

      <!-- 2. SIGNUP FORM -->
      <form id="signup-form" class="form-view" novalidate>
        <div class="input-group">
          <label class="input-label" for="signup-name">Warrior Title / Name</label>
          <div class="input-wrapper">
            <input type="text" id="signup-name" class="input-field" placeholder="e.g. Arjun Dev"
                   autocomplete="name" required>
          </div>
          <p class="field-hint" id="signup-name-hint">Please tell us what to call you.</p>
        </div>

        <div class="input-group">
          <label class="input-label" for="signup-email">Email Address</label>
          <div class="input-wrapper">
            <input type="email" id="signup-email" class="input-field" placeholder="warrior@chaturanga.in"
                   autocomplete="email" inputmode="email" required>
          </div>
          <p class="field-hint" id="signup-email-hint">Enter a valid email address.</p>
        </div>

        <div class="input-group">
          <label class="input-label" for="signup-password">Secret Passcode</label>
          <div class="input-wrapper">
            <input type="password" id="signup-password" class="input-field" placeholder="At least 8 characters"
                   autocomplete="new-password" required minlength="8">
            <button type="button" class="toggle-password" aria-label="Show password" onclick="togglePasswordVisibility('signup-password', this)">👁</button>
          </div>
          <p class="field-hint" id="signup-password-hint">Passcode must be at least 8 characters.</p>
        </div>

        <div class="form-options">
          <label class="checkbox-container">
            <input type="checkbox" id="accept-rules" required>
            <span>Accept Rules of Engagement</span>
          </label>
        </div>

        <button type="submit" class="btn-submit" id="signup-submit">
          <span class="btn-label">Pledge Allegiance</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>
      </form>

      <!-- 3. FORGOT PASSWORD FORM -->
      <form id="forgot-form" class="form-view" novalidate>
        <div class="input-group">
          <label class="input-label" for="forgot-email">Registered Email Address</label>
          <div class="input-wrapper">
            <input type="email" id="forgot-email" class="input-field" placeholder="warrior@chaturanga.in"
                   autocomplete="email" inputmode="email" required>
          </div>
          <p class="field-hint" id="forgot-email-hint">Enter a valid email address.</p>
        </div>

        <button type="submit" class="btn-submit" id="forgot-submit">
          <span class="btn-label">Send Recovery Seal</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>

        <div class="back-login">
          Remembered? <button type="button" onclick="switchTab('login')">Return to Sign In</button>
        </div>
      </form>

    </div>
  </div>

  <!-- Shared session helper (same file included on every page of the site) -->
  <script src="session.js"></script>

  <!-- PAGE LOGIC -->

  <script>
    // Point this at wherever the Express server actually runs.
    // Point this at wherever the Express server actually runs.
const API_BASE = 'http://localhost:5000';

// If a session already exists (from a previous visit), skip the auth
// screen entirely — this is the payoff of Session living in one file.
if (Session.isLoggedIn()) {
  window.location.href = 'index.html';
}

function renderNavUser() {
  const navUser = document.getElementById('navUser');
  if (!navUser) return;
  navUser.innerHTML = '';

  const user = Session.get();

  if (user) {
    const badge = document.createElement('div');
    badge.className = 'nav-user-badge';

    const avatar = document.createElement('span');
    avatar.className = 'nav-user-avatar';
    avatar.textContent = (user.name || user.email || '?').trim().charAt(0).toUpperCase();

    const name = document.createElement('span');
    name.className = 'nav-user-name';
    name.textContent = user.name || user.email;
    name.title = user.name || user.email; // full name on hover if truncated

    const logoutBtn = document.createElement('button');
    logoutBtn.type = 'button';
    logoutBtn.className = 'nav-logout-btn';
    logoutBtn.setAttribute('aria-label', 'Log out');
    logoutBtn.title = 'Log out';
    logoutBtn.innerHTML = '<i class="fa-solid fa-right-from-bracket"></i>';
    logoutBtn.addEventListener('click', function () {
      Session.clear();
      renderNavUser();
    });

    badge.appendChild(avatar);
    badge.appendChild(name);
    badge.appendChild(logoutBtn);
    navUser.appendChild(badge);
  } else {
    const link = document.createElement('a');
    link.href = 'loginpage.html';
    link.className = 'nav-signin-link';
    link.innerHTML = '<i class="fa-solid fa-user"></i> <span>Sign In</span>';
    navUser.appendChild(link);
  }
}

renderNavUser();
Session.onChange(renderNavUser); // stays in sync if another tab logs in/out

/* ---------- Tab switching ---------- */
function switchTab(target) {
  const switcher = document.getElementById('tab-switcher');
  const tabs = switcher.querySelectorAll('.tab-btn');
  const forms = document.querySelectorAll('.form-view');

  switcher.style.display = (target === 'forgot') ? 'none' : 'flex';
  tabs.forEach(tab => tab.classList.toggle('active', tab.dataset.tab === target));
  forms.forEach(form => form.classList.toggle('active', form.id === `${target}-form`));

  hideAlert();
}

/* ---------- Inline alert banner ---------- */
const alertEl = document.getElementById('form-alert');
const alertIconEl = document.getElementById('alert-icon');
const alertTextEl = document.getElementById('alert-text');

function showAlert(message, type) {
  alertEl.classList.remove('error', 'success');
  alertEl.classList.add('show', type);
  alertIconEl.textContent = type === 'success' ? '✓' : '⚠';
  alertTextEl.textContent = message;
}

function hideAlert() {
  alertEl.classList.remove('show', 'error', 'success');
}

/* ---------- Field validation helpers ---------- */
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function setFieldValidity(inputEl, hintEl, valid) {
  inputEl.classList.toggle('invalid', !valid);
  if (hintEl) hintEl.classList.toggle('show', !valid);
}

/* ---------- Button loading state ---------- */
function setLoading(buttonEl, isLoading) {
  buttonEl.classList.toggle('loading', isLoading);
  buttonEl.disabled = isLoading;
}

/* ---------- Password visibility toggle ---------- */
function togglePasswordVisibility(fieldId, btn) {
  const input = document.getElementById(fieldId);
  const showing = input.type === 'text';
  input.type = showing ? 'password' : 'text';
  btn.style.color = showing ? 'var(--gold-dim)' : 'var(--gold)';
  btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
}

/* ---------- API helper ---------- */
async function callApi(path, body) {
  let res;
  try {
    res = await fetch(`${API_BASE}${path}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
  } catch (networkErr) {
    return { success: false, message: 'Could not reach the server — make sure the backend is running on localhost:5000.' };
  }
  let data;
  try {
    data = await res.json();
  } catch (parseErr) {
    return { success: false, message: 'Unexpected response from the server.' };
  }
  // The server sends a meaningful message alongside non-2xx statuses too
  // (409 on duplicate email, 401 on bad credentials, etc) — surface it
  // instead of only trusting `success`.
  if (!res.ok && data.success === undefined) {
    data.success = false;
  }
  return data;
}

/* ---------- LOGIN ---------- */
document.getElementById('login-form').addEventListener('submit', async function (e) {
  e.preventDefault();
  hideAlert();

  const emailEl = document.getElementById('login-email');
  const passwordEl = document.getElementById('login-password');
  const email = emailEl.value.trim();
  const password = passwordEl.value;

  const emailValid = EMAIL_RE.test(email);
  const passwordValid = password.length > 0;
  setFieldValidity(emailEl, document.getElementById('login-email-hint'), emailValid);
  setFieldValidity(passwordEl, document.getElementById('login-password-hint'), passwordValid);
  if (!emailValid || !passwordValid) return;

  const submitBtn = document.getElementById('login-submit');
  setLoading(submitBtn, true);

  const result = await callApi('/api/auth/login', { email, password });

  setLoading(submitBtn, false);

  if (result.success) {
    const remember = document.getElementById('remember-me').checked;
    // result.user.id (Mongo _id) is what the WS game server expects as
    // `userId` on create-room / join-room / quick-match messages so that
    // this player's elo/history is tracked against their real account
    // instead of a throwaway guest token.
    Session.save(result.user, remember);
    showAlert('Welcome back! Taking you to the battlefield...', 'success');
    setTimeout(() => { window.location.href = 'index.html'; }, 900);
  } else {
    showAlert(result.message || 'Invalid credentials.', 'error');
  }
});

/* ---------- SIGNUP ---------- */
document.getElementById('signup-form').addEventListener('submit', async function (e) {
  e.preventDefault();
  hideAlert();

  const nameEl = document.getElementById('signup-name');
  const emailEl = document.getElementById('signup-email');
  const passwordEl = document.getElementById('signup-password');
  const acceptEl = document.getElementById('accept-rules');

  const name = nameEl.value.trim();
  const email = emailEl.value.trim();
  const password = passwordEl.value;

  const nameValid = name.length > 0;
  const emailValid = EMAIL_RE.test(email);
  const passwordValid = password.length >= 8;

  setFieldValidity(nameEl, document.getElementById('signup-name-hint'), nameValid);
  setFieldValidity(emailEl, document.getElementById('signup-email-hint'), emailValid);
  setFieldValidity(passwordEl, document.getElementById('signup-password-hint'), passwordValid);
  if (!nameValid || !emailValid || !passwordValid) return;

  if (!acceptEl.checked) {
    showAlert('Please accept the Rules of Engagement to continue.', 'error');
    return;
  }

  const submitBtn = document.getElementById('signup-submit');
  setLoading(submitBtn, true);

  const result = await callApi('/api/auth/register', { name, email, password });

  setLoading(submitBtn, false);

  if (result.success) {
    Session.save(result.user, true);
    showAlert('Account created! Taking you to the battlefield...', 'success');
    setTimeout(() => { window.location.href = 'index.html'; }, 900);
  } else {
    showAlert(result.message || 'Registration failed.', 'error');
  }
});

// Clear a field's error state as soon as the person edits it again,
// instead of leaving a stale red border until the next submit attempt.
document.querySelectorAll('.input-field').forEach(function (input) {
  input.addEventListener('input', function () {
    input.classList.remove('invalid');
    const hint = document.getElementById(input.id + '-hint');
    if (hint) hint.classList.remove('show');
  });
});
