<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chaturanga — User Profile</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@300;400;500;600&family=Yatra+One&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
 
  :root {
    --maroon: #3d0b0b;
    --maroon-mid: #5c1a1a;
    --crimson: #8b1a1a;
    --gold: #c9a84c;
    --gold-light: #e8cc80;
    --gold-dim: #8a6e2f;
    --sandstone: #e8d5a3;
    --parchment: #f4ead0;
    --midnight: #120400;
    --dark-bg: #1a0600;
    --text: #f4ead0;
    --text-muted: #c9b890;
    --text-dark: #2a0e0e;
    --border-gold: 1px solid rgba(201, 168, 76, 0.3);
    --radius: 12px;
    --radius-lg: 20px;
    --shadow-gold: 0 0 30px rgba(201, 168, 76, 0.15);
    --shadow-deep: 0 8px 40px rgba(0, 0, 0, 0.5);
    --font-display: 'Cinzel', serif;
    --font-deva: 'Noto Sans Devanagari', sans-serif;
    --font-body: 'Raleway', sans-serif;
    --font-yatra: 'Yatra One', cursive;
    --transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
 
    --win-color: #4caf50;
    --loss-color: #e05a5a;
    --quit-color: #ff9800;
 
    --nav-h: 64px;
    --container-pad: 24px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
  }
 
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { overscroll-behavior-y: contain; }
 
  body {
    font-family: var(--font-body);
    background: var(--dark-bg);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(139, 26, 26, 0.18) 0%, transparent 45%),
      radial-gradient(circle at 85% 20%, rgba(201, 168, 76, 0.08) 0%, transparent 40%);
    color: var(--text);
    overflow-x: hidden;
    line-height: 1.7;
    width: 100%;
    max-width: 100vw;
    min-height: 100vh;
    padding-top: calc(var(--nav-h) + var(--safe-top));
  }
 
  a { color: inherit; }
 
  /* ── Top nav ─────────────────────────────────────────────────────── */
  .top-nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--nav-h);
    padding: 0 20px;
    padding-top: var(--safe-top);
    padding-left: calc(20px + var(--safe-left));
    padding-right: calc(20px + var(--safe-right));
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: linear-gradient(145deg, var(--midnight), var(--maroon));
    border-bottom: var(--border-gold);
    box-shadow: var(--shadow-deep);
    z-index: 100;
  }
 
  .nav-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
 
  .nav-back-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    flex: 0 0 38px;
    border-radius: 50%;
    color: var(--gold);
    text-decoration: none;
    background: rgba(201, 168, 76, 0.08);
    border: var(--border-gold);
    transition: var(--transition);
  }
  .nav-back-btn:hover {
    background: rgba(201, 168, 76, 0.18);
    color: var(--gold-light);
    box-shadow: var(--shadow-gold);
    transform: translateX(-2px);
  }
 
  .nav-logo {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    min-width: 0;
  }
  .nav-logo i { color: var(--gold); font-size: 1.1rem; }
  .nav-logo-text {
    font-family: var(--font-display);
    color: var(--gold-light);
    letter-spacing: 1.5px;
    font-weight: 700;
    font-size: 1.05rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
 
  .nav-right { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
 
  .nav-user-mini {
    width: 34px;
    height: 34px;
    flex: 0 0 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: var(--midnight);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 0.85rem;
    box-shadow: 0 0 14px rgba(201, 168, 76, 0.25);
  }
 
  .nav-user-info { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
  .nav-user-name {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--parchment);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 30vw;
  }
  .nav-user-elo { font-size: 0.7rem; color: var(--gold); }
 
  @media (max-width: 560px) {
    .nav-user-info { display: none; }
  }
 
  /* ── Page container ──────────────────────────────────────────────── */
  .container {
    max-width: 900px;
    margin: 40px auto;
    padding: 0 var(--container-pad);
    padding-left: calc(var(--container-pad) + var(--safe-left));
    padding-right: calc(var(--container-pad) + var(--safe-right));
  }
 
  .nav-back {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--text-muted);
    text-decoration: none;
    margin-bottom: 24px;
    font-family: var(--font-display);
    font-size: 0.95rem;
    letter-spacing: 0.5px;
    transition: var(--transition);
    padding: 8px 14px;
    border-radius: var(--radius);
    background: rgba(201, 168, 76, 0.05);
    border: var(--border-gold);
  }
  .nav-back i { color: var(--gold); transition: transform 0.2s ease; }
  .nav-back:hover {
    color: var(--gold-light);
    background: rgba(201, 168, 76, 0.12);
    border-color: var(--gold);
    box-shadow: var(--shadow-gold);
  }
  .nav-back:hover i { transform: translateX(-4px); }
 
  /* ── Profile card ────────────────────────────────────────────────── */
  .profile-card {
    background: linear-gradient(145deg, var(--midnight), var(--maroon));
    border: var(--border-gold);
    border-radius: var(--radius-lg);
    padding: 32px;
    display: flex;
    align-items: center;
    gap: 24px;
    box-shadow: var(--shadow-deep), var(--shadow-gold);
    margin-bottom: 28px;
    position: relative;
    overflow: hidden;
  }
  .profile-card::after {
    content: '';
    position: absolute;
    top: -50%;
    right: -20%;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(201, 168, 76, 0.08) 0%, transparent 70%);
    pointer-events: none;
  }
 
  .avatar-large {
    font-size: 2.8rem;
    color: var(--midnight);
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    width: 90px;
    height: 90px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 0 20px rgba(201, 168, 76, 0.3);
    border: 2px solid var(--gold-light);
  }
 
  .profile-details { min-width: 0; }
  .profile-details h1 {
    margin: 0 0 6px 0;
    font-family: var(--font-display);
    font-size: 2rem;
    color: var(--parchment);
    letter-spacing: 1px;
  }
  .profile-details p {
    margin: 4px 0;
    color: var(--text-muted);
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .profile-details p i { color: var(--gold-dim); width: 16px; text-align: center; }
 
  .rating-pill {
    margin-left: auto;
    text-align: center;
    flex: 0 0 auto;
  }
  .rating-pill .rating-value {
    font-family: var(--font-display);
    font-size: 1.8rem;
    color: var(--gold-light);
    font-weight: 700;
    line-height: 1;
  }
  .rating-pill .rating-label {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 4px;
  }
  @media (max-width: 600px) {
    .rating-pill { margin-left: 0; }
  }

  /* ── Rank badge (same tiers/colors as the lobby, for consistency) ──── */
  .rank-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 0.65rem;
    font-weight: 600;
    margin-bottom: 6px;
    letter-spacing: 0.04em;
    font-family: var(--font-body);
  }
  .rank-novice     { background: rgba(156,163,175,.12); color: #9ca3af; border: 1px solid rgba(156,163,175,.25); }
  .rank-warrior    { background: rgba(96,165,250,.12);  color: #60a5fa; border: 1px solid rgba(96,165,250,.25); }
  .rank-charioteer { background: rgba(74,222,128,.12);  color: #4ade80; border: 1px solid rgba(74,222,128,.25); }
  .rank-archer     { background: rgba(251,191,36,.12);  color: #fbbf24; border: 1px solid rgba(251,191,36,.25); }
  .rank-master     { background: rgba(167,139,250,.12); color: #a78bfa; border: 1px solid rgba(167,139,250,.25); }
  .rank-brahmastra {
    background: linear-gradient(135deg, rgba(201,168,76,.18), rgba(245,228,160,.12));
    color: #f5e4a0; border: 1px solid rgba(201,168,76,.4);
  }
 
  /* ── Stats row ───────────────────────────────────────────────────── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 36px;
  }
  .stat-card {
    background: var(--midnight);
    border: var(--border-gold);
    border-radius: var(--radius);
    padding: 18px 12px;
    text-align: center;
    transition: var(--transition);
  }
  .stat-card:hover {
    border-color: var(--gold);
    box-shadow: var(--shadow-gold);
  }
  .stat-card i { color: var(--gold-dim); font-size: 1rem; margin-bottom: 8px; display: block; }
  .stat-card .stat-value {
    font-family: var(--font-display);
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--gold-light);
    line-height: 1;
  }
  .stat-card .stat-label {
    margin-top: 6px;
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .stat-card.wins .stat-value { color: var(--win-color); }
  .stat-card.losses .stat-value { color: var(--loss-color); }
 
  @media (max-width: 640px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
  }
 
  /* ── Section header ──────────────────────────────────────────────── */
  .section-title {
    font-family: var(--font-display);
    font-size: 1.4rem;
    color: var(--sandstone);
    margin-bottom: 20px;
    border-bottom: 1px solid rgba(201, 168, 76, 0.25);
    padding-bottom: 10px;
    letter-spacing: 0.8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-title::before { content: '✦'; color: var(--gold); font-size: 1rem; }
 
  /* ── History table ───────────────────────────────────────────────── */
  .table-container {
    background: var(--midnight);
    border: var(--border-gold);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow-deep);
  }
  .history-table { width: 100%; border-collapse: collapse; text-align: left; }
  .history-table th, .history-table td { padding: 16px 20px; }
  .history-table th {
    background: rgba(61, 11, 11, 0.6);
    color: var(--gold-light);
    font-family: var(--font-display);
    font-size: 0.85rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    border-bottom: 1px solid rgba(201, 168, 76, 0.2);
  }
  .history-table tr {
    border-bottom: 1px solid rgba(201, 168, 76, 0.08);
    transition: background 0.2s ease;
  }
  .history-table tbody tr:hover { background: rgba(201, 168, 76, 0.04); }
  .history-table tbody tr:last-child { border-bottom: none; }
 
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 100px;
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-family: var(--font-display);
  }
  .badge-win { background: rgba(76, 175, 80, 0.15); color: var(--win-color); border: 1px solid rgba(76, 175, 80, 0.3); }
  .badge-defeat { background: rgba(224, 90, 90, 0.15); color: var(--loss-color); border: 1px solid rgba(224, 90, 90, 0.3); }
  .badge-quitted { background: rgba(255, 152, 0, 0.15); color: var(--quit-color); border: 1px solid rgba(255, 152, 0, 0.3); }
 
  .no-data { text-align: center; padding: 48px; color: var(--text-muted); font-style: italic; }
 
  /* focus visibility */
  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--gold-light);
    outline-offset: 2px;
  }
 
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }
 
  /* ── Mobile ──────────────────────────────────────────────────────── */
  @media (max-width: 600px) {
    .container { margin: 20px auto; }
    .profile-card { flex-direction: column; text-align: center; padding: 24px; gap: 16px; }
    .profile-details p { justify-content: center; }
    .history-table th, .history-table td { padding: 12px 14px; font-size: 0.85rem; }
  }
</style>
</head>
<body>
 
  <nav class="top-nav">
    <div class="nav-left">
      <a href="../index.html" class="nav-back-btn" aria-label="Back to main menu" title="Back to main menu">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <a href="../index.html" class="nav-logo">
        <i class="fa-solid fa-chess-knight"></i>
        <span class="nav-logo-text">CHATURANGA</span>
      </a>
    </div>
    <div class="nav-right">
      <div class="nav-user-info">
        <span class="nav-user-name" id="navUserName">—</span>
        <span class="nav-user-elo" id="navUserElo">—</span>
      </div>
      <div class="nav-user-mini" id="navUserInitial">?</div>
    </div>
  </nav>
 
  <div class="container">
    <a href="../index.html" class="nav-back">
      <i class="fa-solid fa-arrow-left"></i> Back to Main Menu
    </a>
 
    <!-- User Header Card -->
    <div class="profile-card">
      <div class="avatar-large">
        <i class="fa-solid fa-user"></i>
      </div>
      <div class="profile-details">
        <h1 id="profName">Loading...</h1>
        <p id="profEmail"><i class="fa-solid fa-envelope"></i> —</p>
        <p id="profJoined"><i class="fa-solid fa-calendar"></i> —</p>
      </div>
      <div class="rating-pill">
        <div class="rank-badge rank-novice" id="profRankBadge">♟ —</div>
        <div class="rating-value" id="profRating">—</div>
        <div class="rating-label">Rating</div>
      </div>
    </div>
 
    <!-- Stats Overview -->
    <div class="stats-grid">
      <div class="stat-card">
        <i class="fa-solid fa-chess-board"></i>
        <div class="stat-value" id="statGames">—</div>
        <div class="stat-label">Games Played</div>
      </div>
      <div class="stat-card wins">
        <i class="fa-solid fa-trophy"></i>
        <div class="stat-value" id="statWins">—</div>
        <div class="stat-label">Wins</div>
      </div>
      <div class="stat-card losses">
        <i class="fa-solid fa-chess-king"></i>
        <div class="stat-value" id="statLosses">—</div>
        <div class="stat-label">Losses</div>
      </div>
      <div class="stat-card">
        <i class="fa-solid fa-percent"></i>
        <div class="stat-value" id="statWinRate">—</div>
        <div class="stat-label">Win Rate</div>
      </div>
    </div>
 
    <!-- Match History Section -->
    <h2 class="section-title">Recent Matches (Last 50)</h2>
 
    <div class="table-container">
      <table class="history-table">
        <thead>
          <tr>
            <th>Mode</th>
            <th>Result</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="historyBody">
          <tr>
            <td colspan="3" class="no-data">Fetching game records...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="../js/session.js"></script>
  <script>
    // Same ELO tiers as the lobby's rank system — kept in sync so a player's
    // rank badge always matches what they see in the lobby.
    const RANKS = [
      { min: 0,    max: 999,  icon: '♟', label: 'Shishya',    cls: 'rank-novice'     },
      { min: 1000, max: 1199, icon: '♞', label: 'Yoddha',      cls: 'rank-warrior'    },
      { min: 1200, max: 1399, icon: '♝', label: 'Sarathi',     cls: 'rank-charioteer' },
      { min: 1400, max: 1599, icon: '♜', label: 'Arjuna',      cls: 'rank-archer'     },
      { min: 1600, max: 1799, icon: '♚', label: 'Maharaja',    cls: 'rank-master'     },
      { min: 1800, max: 9999, icon: '✦', label: 'Brahmastra',  cls: 'rank-brahmastra' },
    ];
    function getRank(elo) {
      return RANKS.slice().reverse().find(r => elo >= r.min) || RANKS[0];
    }
    function renderRankBadge(elo) {
      const el = document.getElementById('profRankBadge');
      if (!el) return;
      const r = getRank(elo);
      el.textContent = `${r.icon} ${r.label}`;
      el.className = 'rank-badge ' + r.cls;
    }

    // Reads ?id= (or ?userId=) from the URL. Present + non-empty -> viewing
    // that user's profile. Empty/absent -> falls back to the session user.
    function getTargetUserIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const raw = params.get('id') || params.get('userId') || '';
      return raw.trim();
    }

    // The top-left back button and the "Back to Main Menu" link should
    // return the user to wherever they came from: the lobby if they got
    // here from a friend's name, the main menu otherwise. Landing point is
    // read from ?from=lobby; falls back to the referrer, then the main menu.
    function setupBackButton() {
      const params = new URLSearchParams(window.location.search);
      const from = (params.get('from') || '').toLowerCase();

      let backHref = '../index.html';
      if (from === 'lobby') {
        backHref = '../../game/lobby.html';
      } else if (!from && document.referrer && /\/game\/lobby(\.html)?(\?|#|$)/.test(document.referrer)) {
        backHref = '../../game/lobby.html';
      }

      document.querySelectorAll('.nav-back-btn, .nav-back').forEach(el => el.setAttribute('href', backHref));
    }

    // Nav mini profile (top-right) always reflects who is actually logged
    // in on this browser -- not necessarily the profile being viewed.
    function renderNavFromSession(sessionUser) {
      const nameEl = document.getElementById("navUserName");
      const eloEl = document.getElementById("navUserElo");
      const initialEl = document.getElementById("navUserInitial");
      if (!nameEl || !eloEl || !initialEl) return;

      if (sessionUser) {
        const displayName = sessionUser.name || sessionUser.email || 'Player';
        nameEl.textContent = displayName;
        eloEl.textContent = typeof sessionUser.elo === 'number' ? `${sessionUser.elo} ELO` : '—';
        initialEl.textContent = displayName.trim().charAt(0).toUpperCase();
      } else {
        nameEl.textContent = 'Guest';
        eloEl.textContent = '—';
        initialEl.textContent = '?';
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      setupBackButton();

      // 1. Figure out whose profile to show: a URL param wins over the
      // logged-in session user.
      const paramUserId = getTargetUserIdFromUrl();
      const sessionUser = Session.get();
      const sessionUserId = sessionUser ? (sessionUser.id || sessionUser._id) : null;
      const userId = paramUserId || sessionUserId;

      renderNavFromSession(sessionUser);

      if (!userId) {
        window.location.href = "login.html"; // Redirect to login if unauthenticated and no profile was requested
        return;
      }

      try {
        // 2. Fetch fresh user data from API
        const response = await fetch(`http://localhost:5000/api/user/${userId}`);
        const data = await response.json();

        if (!data.success) {
          throw new Error("Failed to load user profile");
        }

        const profile = data.user;
        const elo = typeof profile.elo === 'number' ? profile.elo : 1200;

        // 3. Render Profile Info
        document.getElementById("profName").textContent = profile.name;
        document.getElementById("profEmail").innerHTML = `<i class="fa-solid fa-envelope"></i> ${profile.email}`;
        document.getElementById("profJoined").innerHTML = `<i class="fa-solid fa-calendar"></i> Joined ${
          profile.createdAt
            ? new Date(profile.createdAt).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' })
            : 'Unknown'
        }`;

        // 4. Render ELO + rank badge
        document.getElementById("profRating").textContent = elo;
        renderRankBadge(elo);

        // 5. Compute wins / losses / win rate from the last 50 games
        // (a "quit" still counts against you, same convention the lobby uses)
        const games = profile.last50games || [];
        const wins = games.filter(g => g.result === 'win').length;
        const losses = games.filter(g => g.result === 'defeat' || g.result === 'quitted').length;
        const winRate = games.length > 0 ? Math.round((wins / games.length) * 100) : 0;

        document.getElementById("statGames").textContent = games.length;
        document.getElementById("statWins").textContent = wins;
        document.getElementById("statLosses").textContent = losses;
        document.getElementById("statWinRate").textContent = `${winRate}%`;

        // 6. Render Match History Table
        const tbody = document.getElementById("historyBody");
        tbody.innerHTML = "";

        if (!games.length) {
          tbody.innerHTML = `<tr><td colspan="3" class="no-data">No matches recorded yet.</td></tr>`;
          return;
        }

        // Most recent games first
        games.slice().sort((a, b) => new Date(b.endedAt || 0) - new Date(a.endedAt || 0)).forEach(game => {
          const row = document.createElement("tr");

          const dateStr = game.endedAt
            ? new Date(game.endedAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
            : "—";

          const badgeClass = game.result === 'win' ? 'badge-win'
                          : game.result === 'defeat' ? 'badge-defeat'
                          : 'badge-quitted';

          row.innerHTML = `
            <td>${game.type || 'Standard'}</td>
            <td><span class="badge ${badgeClass}">${game.result}</span></td>
            <td>${dateStr}</td>
          `;

          tbody.appendChild(row);
        });

      } catch (err) {
        console.error(err);
        document.getElementById("historyBody").innerHTML = `
          <tr><td colspan="3" class="no-data">Error loading profile data.</td></tr>
        `;
      }
    });
  </script>
</body>
</html>
