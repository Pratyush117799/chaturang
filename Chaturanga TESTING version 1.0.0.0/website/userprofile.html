<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chaturanga — User Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
   *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --maroon: #3d0b0b;
      --maroon-mid: #5c1a1a;
      --crimson: #8b1a1a;
      --gold: #c9a84c;
      --gold-light: #e8cc80;
      --gold-dim: #8a6e2f;
      --sandstone: #e8d5a3;
      --parchment: #f4ead0;
      --midnight: #120400;
      --dark-bg: #1a0600;
      --text: #f4ead0;
      --text-muted: #c9b890;
      --text-dark: #2a0e0e;
      --border-gold: 1px solid rgba(201, 168, 76, 0.3);
      --radius: 12px;
      --radius-lg: 20px;
      --shadow-gold: 0 0 30px rgba(201, 168, 76, 0.15);
      --shadow-deep: 0 8px 40px rgba(0, 0, 0, 0.5);
      --font-display: 'Cinzel', serif;
      --font-deva: 'Noto Sans Devanagari', sans-serif;
      --font-body: 'Raleway', sans-serif;
      --font-yatra: 'Yatra One', cursive;
      --transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);

      /* Mode Outcome Colors */
      --win-color: #4caf50;
      --loss-color: #e05a5a;
      --quit-color: #ff9800;

      /* Mobile-friendly helpers */
      --nav-h: 64px;
      --container-pad: 24px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    html, body {
      overscroll-behavior-y: contain;
    }

    body {
      font-family: var(--font-body);
      background: var(--dark-bg);
      color: var(--text);
      overflow-x: hidden;
      line-height: 1.7;
      width: 100%;
      max-width: 100vw;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 var(--container-pad);
    }

    /* Back Navigation Link */
    .nav-back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text-muted);
      text-decoration: none;
      margin-bottom: 24px;
      font-family: var(--font-display);
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      transition: var(--transition);
      padding: 8px 14px;
      border-radius: var(--radius);
      background: rgba(201, 168, 76, 0.05);
      border: var(--border-gold);
    }

    .nav-back i {
      color: var(--gold);
      transition: transform 0.2s ease;
    }

    .nav-back:hover {
      color: var(--gold-light);
      background: rgba(201, 168, 76, 0.12);
      border-color: var(--gold);
      box-shadow: var(--shadow-gold);
    }

    .nav-back:hover i {
      transform: translateX(-4px);
    }

    /* User Profile Card */
    .profile-card {
      background: linear-gradient(145deg, var(--midnight), var(--maroon));
      border: var(--border-gold);
      border-radius: var(--radius-lg);
      padding: 32px;
      display: flex;
      align-items: center;
      gap: 24px;
      box-shadow: var(--shadow-deep), var(--shadow-gold);
      margin-bottom: 36px;
      position: relative;
      overflow: hidden;
    }

    /* Decorative background accent */
    .profile-card::after {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(201, 168, 76, 0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .avatar-large {
      font-size: 2.8rem;
      color: var(--midnight);
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      width: 90px;
      height: 90px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 20px rgba(201, 168, 76, 0.3);
      border: 2px solid var(--gold-light);
    }

    .profile-details h1 {
      margin: 0 0 6px 0;
      font-family: var(--font-display);
      font-size: 2rem;
      color: var(--parchment);
      letter-spacing: 1px;
    }

    .profile-details p {
      margin: 4px 0;
      color: var(--text-muted);
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .profile-details p i {
      color: var(--gold-dim);
    }

    /* Section Header */
    .section-title {
      font-family: var(--font-display);
      font-size: 1.4rem;
      color: var(--sandstone);
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(201, 168, 76, 0.25);
      padding-bottom: 10px;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title::before {
      content: '✦';
      color: var(--gold);
      font-size: 1rem;
    }

    /* History Table */
    .table-container {
      background: var(--midnight);
      border: var(--border-gold);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-deep);
    }

    .history-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .history-table th, 
    .history-table td {
      padding: 16px 20px;
    }

    .history-table th {
      background: rgba(61, 11, 11, 0.6);
      color: var(--gold-light);
      font-family: var(--font-display);
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(201, 168, 76, 0.2);
    }

    .history-table tr {
      border-bottom: 1px solid rgba(201, 168, 76, 0.08);
      transition: background 0.2s ease;
    }

    .history-table tbody tr:hover {
      background: rgba(201, 168, 76, 0.04);
    }

    .history-table tbody tr:last-child {
      border-bottom: none;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-family: var(--font-display);
    }

    .badge-win {
      background: rgba(76, 175, 80, 0.15);
      color: var(--win-color);
      border: 1px solid rgba(76, 175, 80, 0.3);
    }

    .badge-defeat {
      background: rgba(224, 90, 90, 0.15);
      color: var(--loss-color);
      border: 1px solid rgba(224, 90, 90, 0.3);
    }

    .badge-quitted {
      background: rgba(255, 152, 0, 0.15);
      color: var(--quit-color);
      border: 1px solid rgba(255, 152, 0, 0.3);
    }

    .no-data {
      text-align: center;
      padding: 48px;
      color: var(--text-muted);
      font-style: italic;
    }

    /* Respect reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* Mobile Responsive Adjustments */
    @media (max-width: 600px) {
      .container {
        margin: 20px auto;
      }

      .profile-card {
        flex-direction: column;
        text-align: center;
        padding: 24px;
        gap: 16px;
      }

      .profile-details p {
        justify-content: center;
      }

      .history-table th, 
      .history-table td {
        padding: 12px 14px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="nav-back">
      <i class="fa-solid fa-arrow-left"></i> Back to Main Menu
    </a>

    <!-- User Header Card -->
    <div class="profile-card">
      <div class="avatar-large">
        <i class="fa-solid fa-user"></i>
      </div>
      <div class="profile-details">
        <h1 id="profName">Loading...</h1>
        <p id="profEmail"><i class="fa-solid fa-envelope"></i> —</p>
      </div>
    </div>

    <!-- Match History Section -->
    <h2 class="section-title">Recent Matches (Last 50)</h2>
    
    <div class="table-container">
      <table class="history-table">
        <thead>
          <tr>
            <th>Mode</th>
            <th>Result</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="historyBody">
          <tr>
            <td colspan="3" class="no-data">Fetching game records...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="session.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // 1. Get Session Data
      const user = Session.get();
      if (!user) {
        window.location.href = "login.html"; // Redirect to login if unauthenticated
        return;
      }

      const userId = user.id || user._id;

      try {
        // 2. Fetch fresh user data from API
        const response = await fetch(`http://localhost:5000/api/user/${userId}`);
        const data = await response.json();

        if (!data.success) {
          throw new Error("Failed to load user profile");
        }

        const profile = data.user;

        // 3. Render Profile Info
        document.getElementById("profName").textContent = profile.name;
        document.getElementById("profEmail").innerHTML = `<i class="fa-solid fa-envelope"></i> ${profile.email}`;

        // 4. Render Match History Table
        const tbody = document.getElementById("historyBody");
        tbody.innerHTML = "";

        if (!profile.last50games || profile.last50games.length === 0) {
          tbody.innerHTML = `<tr><td colspan="3" class="no-data">No matches recorded yet.</td></tr>`;
          return;
        }

        profile.last50games.forEach(game => {
          const row = document.createElement("tr");

          const dateStr = game.endedAt 
            ? new Date(game.endedAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
            : "—";

          const badgeClass = game.result === 'win' ? 'badge-win' 
                          : game.result === 'defeat' ? 'badge-defeat' 
                          : 'badge-quitted';

          row.innerHTML = `
            <td>${game.type || 'Standard'}</td>
            <td><span class="badge ${badgeClass}">${game.result}</span></td>
            <td>${dateStr}</td>
          `;

          tbody.appendChild(row);
        });

      } catch (err) {
        console.error(err);
        document.getElementById("historyBody").innerHTML = `
          <tr><td colspan="3" class="no-data">Error loading profile data.</td></tr>
        `;
      }
    });
  </script>
</body>
</html>
